<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>빅오 복잡도 탐색기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --navy: #1E3A4A;
  --teal: #5F9EA5;
  --coral: #C96B63;
  --gold: #D4A853;
  --bg: #F0F4F7;
  --white: #FFFFFF;
  --text: #1E293B;
  --muted: #64748B;
  --border: #CBD5E1;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  background: var(--bg); color: var(--text); font-size: 14px;
}

.hdr {
  background: linear-gradient(135deg, var(--navy), #2D5266);
  color: white; padding: 18px 28px;
  display: flex; align-items: baseline; gap: 14px;
}
.hdr h1 { font-size: 1.2rem; font-weight: 700; }
.hdr p  { font-size: 0.75rem; opacity: 0.6; }

.main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }

/* Input section */
.input-card {
  background: white; border-radius: 12px; padding: 20px 24px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 18px;
}
.input-card h2 { font-size: 0.9rem; color: var(--muted); margin-bottom: 14px; font-weight: 700; letter-spacing: 0.3px; }
.slider-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.slider-wrap { flex: 1; min-width: 200px; }
.n-label { font-size: 1.8rem; font-weight: 800; color: var(--navy); font-family: monospace; min-width: 80px; }
.n-unit  { font-size: 0.78rem; color: var(--muted); }
input[type=range] {
  width: 100%; height: 6px; appearance: none; background: var(--border);
  border-radius: 3px; outline: none; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  appearance: none; width: 22px; height: 22px; border-radius: 50%;
  background: var(--teal); cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.preset-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.preset-btn {
  padding: 5px 12px; border: 1.5px solid var(--border); border-radius: 5px;
  background: white; font-size: 0.75rem; font-weight: 700; cursor: pointer;
  color: var(--muted); transition: all 0.15s; font-family: monospace;
}
.preset-btn:hover { border-color: var(--teal); color: var(--teal); }

/* Grid layout */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media(max-width: 700px) { .grid { grid-template-columns: 1fr; } }

/* Algorithm table */
.table-card {
  background: white; border-radius: 12px; padding: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.table-card h2 { font-size: 0.88rem; color: var(--muted); margin-bottom: 14px; font-weight: 700; letter-spacing: 0.3px; }
.algo-row {
  display: flex; align-items: center; padding: 10px 0;
  border-bottom: 1px solid #F1F5F9; gap: 10px;
}
.algo-row:last-child { border-bottom: none; }
.algo-color { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.algo-name { font-weight: 700; font-size: 0.82rem; flex: 1; }
.algo-bigo { font-family: monospace; font-size: 0.78rem; color: var(--muted); min-width: 80px; }
.algo-count {
  font-family: monospace; font-size: 0.95rem; font-weight: 800;
  min-width: 90px; text-align: right;
}
.algo-bar-wrap { flex: 1; max-width: 80px; }
.algo-bar {
  height: 6px; border-radius: 3px; transition: width 0.4s ease;
  min-width: 2px;
}

/* Curve match section */
.match-card {
  background: white; border-radius: 12px; padding: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08); grid-column: 1 / -1;
}
.match-card h2 { font-size: 0.88rem; color: var(--muted); margin-bottom: 14px; font-weight: 700; letter-spacing: 0.3px; }

/* Insight boxes */
.insight-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-bottom: 16px; }
.insight {
  background: #F8FAFC; border-radius: 8px; padding: 12px 14px;
  border-left: 4px solid var(--border);
}
.insight-bigo { font-family: monospace; font-size: 0.95rem; font-weight: 800; color: var(--navy); }
.insight-value { font-size: 1.2rem; font-weight: 800; margin: 3px 0; color: var(--navy); font-family: monospace; }
.insight-algos { font-size: 0.72rem; color: var(--muted); line-height: 1.5; }

/* Chart */
.chart-wrap {
  background: white; border-radius: 12px; padding: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08); grid-column: 1 / -1;
  position: relative;
}
.chart-wrap h2 { font-size: 0.88rem; color: var(--muted); margin-bottom: 14px; font-weight: 700; letter-spacing: 0.3px; }
.chart-container { position: relative; height: 340px; }

/* Explanation */
.expl-card {
  background: white; border-radius: 12px; padding: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08); grid-column: 1 / -1;
}
.expl-card h2 { font-size: 0.88rem; color: var(--muted); margin-bottom: 12px; font-weight: 700; letter-spacing: 0.3px; }
.expl-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
.expl-table th { background: var(--navy); color: white; padding: 8px 12px; text-align: left; }
.expl-table td { padding: 8px 12px; border-bottom: 1px solid #F1F5F9; font-family: monospace; }
.expl-table tr:hover td { background: #F8FAFC; }
.expl-table td:nth-child(3) { font-weight: 700; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 0.68rem; font-weight: 700; }
.tag-fast { background: #DCFCE7; color: #15803D; }
.tag-mid  { background: #FEF9C3; color: #A16207; }
.tag-slow { background: #FEE2E2; color: #B91C1C; }
</style>
</head>
<body>

<div class="hdr">
  <h1>빅오 복잡도 탐색기</h1>
  <p>데이터 개수 n을 바꾸면 각 알고리즘의 비교 횟수를 실시간으로 계산하고 복잡도 곡선과 비교합니다</p>
</div>

<div class="main">

  <!-- 슬라이더 -->
  <div class="input-card">
    <h2>데이터 개수 (n) 설정</h2>
    <div class="slider-row">
      <div>
        <div class="n-label" id="n-display">100</div>
        <div class="n-unit">개의 데이터</div>
      </div>
      <div class="slider-wrap">
        <input type="range" id="n-slider" min="2" max="10000" value="100" step="1" oninput="update()">
        <div class="preset-row">
          <button class="preset-btn" onclick="setN(10)">n=10</button>
          <button class="preset-btn" onclick="setN(50)">n=50</button>
          <button class="preset-btn" onclick="setN(100)">n=100</button>
          <button class="preset-btn" onclick="setN(500)">n=500</button>
          <button class="preset-btn" onclick="setN(1000)">n=1,000</button>
          <button class="preset-btn" onclick="setN(5000)">n=5,000</button>
          <button class="preset-btn" onclick="setN(10000)">n=10,000</button>
        </div>
      </div>
    </div>
  </div>

  <div class="grid">

    <!-- 알고리즘 비교 횟수 테이블 -->
    <div class="table-card">
      <h2>탐색 알고리즘 — 비교 횟수 (최악의 경우)</h2>
      <div id="search-rows"></div>
    </div>

    <div class="table-card">
      <h2>정렬 알고리즘 — 비교 횟수 (평균/최악)</h2>
      <div id="sort-rows"></div>
    </div>

    <!-- 복잡도 클래스별 실제값 -->
    <div class="match-card">
      <h2>복잡도 클래스별 n에서의 값</h2>
      <div class="insight-grid" id="insight-grid"></div>
    </div>

    <!-- 그래프 -->
    <div class="chart-wrap">
      <h2>복잡도 곡선 비교 그래프 — n이 커질수록 어떻게 달라지는가?</h2>
      <div class="chart-container">
        <canvas id="myChart"></canvas>
      </div>
    </div>

    <!-- 상세 비교표 -->
    <div class="expl-card">
      <h2>n = <span id="n-in-table">100</span>에서의 전체 비교표</h2>
      <table class="expl-table">
        <thead>
          <tr>
            <th>알고리즘</th>
            <th>복잡도</th>
            <th>n에서의 비교 횟수</th>
            <th>선형(n)과의 비교</th>
            <th>실용성</th>
          </tr>
        </thead>
        <tbody id="full-table"></tbody>
      </table>
    </div>

  </div>
</div>

<script>
// ─── 색상 팔레트 ────────────────────────────────────────────────────
const COLORS = {
  linear:  '#E53E3E',
  binary:  '#2B6CB0',
  bubble:  '#D97706',
  insert:  '#2D9B6F',
  merge:   '#6B46C1',
  // curve colors (lighter)
  c1:    '#94A3B8',
  clogn: '#3B82F6',
  csqrt: '#8B5CF6',
  cn:    '#EF4444',
  cnlogn:'#F59E0B',
  cn2:   '#DC2626',
};

// ─── 복잡도 계산 함수들 ─────────────────────────────────────────────
function calc(n) {
  const log2n = Math.log2(n);
  const sqrtn = Math.sqrt(n);
  return {
    // 탐색 알고리즘 (최악)
    linear:  n,
    binary:  Math.ceil(log2n) + 1,

    // 정렬 알고리즘 (평균/최악)
    bubble:  Math.round(n * (n - 1) / 2),
    insert:  Math.round(n * (n - 1) / 4),   // 평균
    merge:   Math.round(n * log2n),

    // 이론적 복잡도 곡선
    c1:    1,
    clogn: Math.ceil(log2n),
    csqrt: Math.ceil(sqrtn),
    cn:    n,
    cnlogn:Math.round(n * log2n),
    cn2:   n * n,
  };
}

// ─── 알고리즘 메타데이터 ─────────────────────────────────────────────
const SEARCH_ALGOS = [
  { key: 'linear', name: '선형 탐색',  bigo: 'O(n)',         color: COLORS.linear },
  { key: 'binary', name: '이진 탐색',  bigo: 'O(log n)',     color: COLORS.binary },
];
const SORT_ALGOS = [
  { key: 'bubble', name: '버블 정렬',  bigo: 'O(n²) 최악',      color: COLORS.bubble },
  { key: 'insert', name: '삽입 정렬',  bigo: 'O(n²) 평균',      color: COLORS.insert },
  { key: 'merge',  name: '병합 정렬',  bigo: 'O(n log n)',       color: COLORS.merge  },
];
const CURVE_META = [
  { key: 'c1',    label: 'O(1)',         color: COLORS.c1,    dash: [6,4]  },
  { key: 'clogn', label: 'O(log n)',     color: COLORS.clogn, dash: [4,2]  },
  { key: 'cn',    label: 'O(n)',         color: COLORS.linear,dash: [4,2]  },
  { key: 'cnlogn',label: 'O(n log n)',   color: COLORS.merge, dash: [4,2]  },
  { key: 'cn2',   label: 'O(n²)',        color: COLORS.bubble,dash: [4,2]  },
];

// ─── 포맷 헬퍼 ────────────────────────────────────────────────────────
function fmt(n) {
  if (n >= 1e12) return (n/1e12).toFixed(1) + '조';
  if (n >= 1e8)  return (n/1e8).toFixed(1)  + '억';
  if (n >= 1e4)  return (n/1e4).toFixed(1)  + '만';
  return n.toLocaleString();
}

// ─── 차트 초기화 ───────────────────────────────────────────────────────
const ctx = document.getElementById('myChart').getContext('2d');
let chart;

function buildChart(n) {
  // x축 포인트: 1~n 사이 40개
  const pts = [];
  for (let i = 1; i <= 40; i++) {
    pts.push(Math.round(1 + (n - 1) * (i - 1) / 39));
  }

  const datasets = [];

  // 이론 곡선 (점선)
  CURVE_META.forEach(c => {
    datasets.push({
      label: c.label,
      data: pts.map(x => {
        const v = calc(x)[c.key];
        return { x, y: v };
      }),
      borderColor: c.color,
      borderWidth: 1.5,
      borderDash: c.dash,
      pointRadius: 0,
      tension: 0.3,
      fill: false,
      order: 10,
    });
  });

  // 알고리즘 실제값 (굵은 실선)
  const allAlgos = [...SEARCH_ALGOS, ...SORT_ALGOS];
  allAlgos.forEach(a => {
    datasets.push({
      label: a.name,
      data: pts.map(x => {
        const v = calc(x)[a.key];
        return { x, y: v };
      }),
      borderColor: a.color,
      backgroundColor: a.color + '33',
      borderWidth: 2.5,
      pointRadius: 0,
      tension: 0.3,
      fill: false,
      order: 1,
    });
  });

  // 현재 n 수직선
  datasets.push({
    label: `현재 n=${fmt(n)}`,
    data: [{ x: n, y: 0 }, { x: n, y: calc(n).cn2 }],
    borderColor: '#64748B',
    borderWidth: 1,
    borderDash: [3,3],
    pointRadius: 0,
    fill: false,
    order: 0,
  });

  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'line',
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 300 },
      interaction: { intersect: false, mode: 'index' },
      plugins: {
        legend: {
          labels: {
            font: { size: 11, family: 'Noto Sans KR' },
            boxWidth: 14, padding: 10,
          }
        },
        tooltip: {
          callbacks: {
            label: ctx => `${ctx.dataset.label}: ${fmt(Math.round(ctx.parsed.y))}회`
          }
        }
      },
      scales: {
        x: {
          type: 'linear',
          title: { display: true, text: '데이터 개수 n', font: { size: 12 } },
          max: n,
        },
        y: {
          type: 'linear',
          title: { display: true, text: '비교 횟수', font: { size: 12 } },
          ticks: {
            callback: v => fmt(v),
          }
        }
      }
    }
  });
}

// ─── 테이블 행 생성 ───────────────────────────────────────────────────
function makeRows(container, algos, vals, maxVal) {
  container.innerHTML = '';
  algos.forEach(a => {
    const v = vals[a.key];
    const pct = Math.min(100, (v / maxVal) * 100);
    const row = document.createElement('div');
    row.className = 'algo-row';
    row.innerHTML = `
      <div class="algo-color" style="background:${a.color}"></div>
      <div>
        <div class="algo-name">${a.name}</div>
        <div class="algo-bigo">${a.bigo}</div>
      </div>
      <div class="algo-bar-wrap">
        <div class="algo-bar" style="width:${pct}%;background:${a.color}"></div>
      </div>
      <div class="algo-count" style="color:${a.color}">${fmt(v)}회</div>`;
    container.appendChild(row);
  });
}

// ─── 인사이트 카드 ────────────────────────────────────────────────────
function makeInsights(n, vals) {
  const grid = document.getElementById('insight-grid');
  const items = [
    { key:'c1',    bigo:'O(1)',         algos:'-',               color:'#64748B' },
    { key:'clogn', bigo:'O(log n)',     algos:'이진 탐색',        color:COLORS.binary },
    { key:'cn',    bigo:'O(n)',         algos:'선형 탐색',        color:COLORS.linear },
    { key:'cnlogn',bigo:'O(n log n)',   algos:'병합 정렬',        color:COLORS.merge  },
    { key:'cn2',   bigo:'O(n²)',        algos:'버블 정렬 (최악)', color:COLORS.bubble },
  ];
  grid.innerHTML = items.map(it => `
    <div class="insight" style="border-left-color:${it.color}">
      <div class="insight-bigo">${it.bigo}</div>
      <div class="insight-value" style="color:${it.color}">${fmt(vals[it.key])}회</div>
      <div class="insight-algos">${it.algos}</div>
    </div>`).join('');
}

// ─── 전체 비교표 ────────────────────────────────────────────────────────
function makeFullTable(n, vals) {
  document.getElementById('n-in-table').textContent = n.toLocaleString();
  const tbody = document.getElementById('full-table');
  const all = [
    ...SEARCH_ALGOS.map(a=>({...a, type:'탐색'})),
    ...SORT_ALGOS.map(a=>({...a, type:'정렬'})),
  ];
  tbody.innerHTML = all.map(a => {
    const v = vals[a.key];
    const ratio = v / vals.cn;
    let tag, label;
    if (ratio <= 0.1)      { tag='tag-fast'; label='매우 빠름'; }
    else if (ratio <= 2)   { tag='tag-mid';  label='보통';      }
    else                   { tag='tag-slow'; label='느림';      }
    const ratioTxt = ratio < 0.001 ? (ratio*1000).toFixed(2)+'‰'
                   : ratio < 1     ? (ratio*100).toFixed(1)+'%'
                   : ratio.toFixed(1)+'배';
    return `<tr>
      <td><span style="color:${a.color};font-weight:800;">●</span> ${a.name} (${a.type})</td>
      <td>${a.bigo}</td>
      <td>${fmt(v)}회</td>
      <td>${ratioTxt}</td>
      <td><span class="tag ${tag}">${label}</span></td>
    </tr>`;
  }).join('');
}

// ─── 메인 업데이트 ─────────────────────────────────────────────────────
function update() {
  const n = parseInt(document.getElementById('n-slider').value);
  document.getElementById('n-display').textContent = n.toLocaleString();

  const vals = calc(n);

  // 탐색 행
  makeRows(
    document.getElementById('search-rows'),
    SEARCH_ALGOS, vals, Math.max(...SEARCH_ALGOS.map(a=>vals[a.key]))
  );

  // 정렬 행
  makeRows(
    document.getElementById('sort-rows'),
    SORT_ALGOS, vals, Math.max(...SORT_ALGOS.map(a=>vals[a.key]))
  );

  // 인사이트
  makeInsights(n, vals);

  // 전체 표
  makeFullTable(n, vals);

  // 그래프
  buildChart(n);
}

function setN(v) {
  document.getElementById('n-slider').value = v;
  update();
}

// 초기 실행
update();
</script>
</body>
</html>
