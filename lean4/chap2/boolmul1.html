<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>5x5 부울곱 시각화 도구</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; display: flex; flex-direction: column; align-items: center; background: #f4f7f6; padding: 20px; }
        .container { display: flex; align-items: center; gap: 20px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        /* 행렬 공통 스타일 */
        .matrix-box { display: flex; flex-direction: column; align-items: center; }
        .matrix-name { font-weight: bold; margin-bottom: 10px; color: #555; }
        
        /* 5x5 격자 핵심 설정 */
        .matrix-grid { 
            display: grid !important; 
            grid-template-columns: repeat(5, 40px) !important; /* 5열 고정 */
            grid-template-rows: repeat(5, 40px) !important;    /* 5행 고정 */
            gap: 2px; 
            padding: 5px; 
            border-left: 3px solid #333; 
            border-right: 3px solid #333; 
        }

        .cell { 
            width: 40px; height: 40px; 
            display: flex; align-items: center; justify-content: center; 
            border: 1px solid #eee; background: #fff; font-size: 14px;
            cursor: pointer; transition: all 0.2s;
        }

        /* 하이라이트 색상 */
        .hl-row { background-color: #ffecb3 !important; } /* A행: 노랑 */
        .hl-col { background-color: #b3e5fc !important; } /* B열: 파랑 */
        .hl-res { background-color: #c8e6c9 !important; font-weight: bold; transform: scale(1.1); border: 2px solid #4caf50; }

        .operator { font-size: 30px; font-weight: bold; color: #999; }
        .info-box { margin-top: 30px; width: 650px; padding: 20px; background: #2c3e50; color: white; border-radius: 12px; font-size: 15px; line-height: 1.6; min-height: 60px; }
        .formula { color: #ffeb3b; font-family: monospace; }
    </style>
</head>
<body>

    <h2>5x5 행렬 부울곱(Boolean Product) 시각화</h2>
    <p>결과 행렬 <b>C</b>의 칸을 클릭하면 연산 과정을 확인할 수 있습니다.</p>

    <div class="container">
        <div class="matrix-box">
            <div class="matrix-name">Matrix A</div>
            <div id="gridA" class="matrix-grid"></div>
        </div>
        
        <div class="operator">⊙</div>

        <div class="matrix-box">
            <div class="matrix-name">Matrix B</div>
            <div id="gridB" class="matrix-grid"></div>
        </div>

        <div class="operator">=</div>

        <div class="matrix-box">
            <div class="matrix-name">Result C</div>
            <div id="gridC" class="matrix-grid"></div>
        </div>
    </div>

    <div class="info-box" id="info">결과 행렬의 (?)를 클릭하세요.</div>

    <script>
        const size = 5;
        // 랜덤 0 또는 1로 채워진 5x5 배열 생성
        const A = Array.from({length: size}, () => Array.from({length: size}, () => Math.round(Math.random())));
        const B = Array.from({length: size}, () => Array.from({length: size}, () => Math.round(Math.random())));

        function init() {
            const gridA = document.getElementById('gridA');
            const gridB = document.getElementById('gridB');
            const gridC = document.getElementById('gridC');

            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    // Matrix A 생성
                    const cellA = document.createElement('div');
                    cellA.className = `cell a-row-${r}`;
                    cellA.textContent = A[r][c];
                    gridA.appendChild(cellA);

                    // Matrix B 생성
                    const cellB = document.createElement('div');
                    cellB.className = `cell b-col-${c}`;
                    cellB.textContent = B[r][c];
                    gridB.appendChild(cellB);

                    // Result C 생성
                    const cellC = document.createElement('div');
                    cellC.className = `cell res-cell`;
                    cellC.textContent = '?';
                    cellC.onclick = () => calculate(r, c, cellC);
                    gridC.appendChild(cellC);
                }
            }
        }

        function calculate(r, c, targetElement) {
            // 모든 하이라이트 초기화
            document.querySelectorAll('.cell').forEach(el => {
                el.classList.remove('hl-row', 'hl-col', 'hl-res');
            });

            // 현재 선택한 행/열 강조
            document.querySelectorAll(`.a-row-${r}`).forEach(el => el.classList.add('hl-row'));
            document.querySelectorAll(`.b-col-${c}`).forEach(el => el.classList.add('hl-col'));
            targetElement.classList.add('hl-res');

            // 부울곱 계산 (하나라도 1&1 이면 1)
            let result = 0;
            let steps = [];
            for (let k = 0; k < size; k++) {
                const andResult = A[r][k] & B[k][c];
                result |= andResult;
                steps.push(`(${A[r][k]}∧${B[k][c]})`);
            }

            targetElement.textContent = result;
            
            // 정보 표시
            document.getElementById('info').innerHTML = 
                `<b>C[${r+1}, ${c+1}]</b> 계산: <span class="formula">` + steps.join(' ∨ ') + `</span> = <b>${result}</b><br>` +
                `<small>행렬 A의 ${r+1}행과 행렬 B의 ${c+1}열을 원소별 AND 연산 후 모두 OR 하였습니다.</small>`;
        }

        init();
    </script>
</body>
</html>
