<!DOCTYPE html>
<html>
<head>
    <style>
        .matrix-container { display: flex; align-items: center; gap: 20px; font-family: sans-serif; }
        .matrix { border-left: 2px solid black; border-right: 2px solid black; padding: 5px; display: grid; gap: 5px; }
        .cell { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 1px solid #ddd; }
        .highlight-row { background-color: #ffeb3b; }
        .highlight-col { background-color: #81d4fa; }
        .highlight-res { background-color: #a5d6a7; font-weight: bold; }
        .step-box { margin-top: 20px; padding: 15px; border: 1px dashed #666; background: #f9f9f9; }
    </style>
</head>
<body>
    <h2>부울곱 시각화 (Step-by-Step)</h2>
    <div class="matrix-container">
        <div>
            <p>Matrix A</p>
            <div id="matrixA" class="matrix" style="grid-template-columns: repeat(2, 40px);">
                <div class="cell r0">1</div><div class="cell r0">0</div>
                <div class="cell r1">1</div><div class="cell r1">1</div>
            </div>
        </div>
        <span>⊙</span>
        <div>
            <p>Matrix B</p>
            <div id="matrixB" class="matrix" style="grid-template-columns: repeat(2, 40px);">
                <div class="cell c0">0</div><div class="cell c1">1</div>
                <div class="cell c0">1</div><div class="cell c1">0</div>
            </div>
        </div>
        <span>=</span>
        <div>
            <p>Result C</p>
            <div id="matrixC" class="matrix" style="grid-template-columns: repeat(2, 40px);">
                <div class="cell res" onclick="showStep(0,0)">?</div><div class="cell res" onclick="showStep(0,1)">?</div>
                <div class="cell res" onclick="showStep(1,0)">?</div><div class="cell res" onclick="showStep(1,1)">?</div>
            </div>
        </div>
    </div>

    <div class="step-box" id="stepBox">결과 행렬의 (?)를 클릭하면 계산 과정을 볼 수 있습니다.</div>

    <script>
        const A = [[1, 0], [1, 1]];
        const B = [[0, 1], [1, 0]];

        function showStep(r, c) {
            // 하이라이트 초기화
            document.querySelectorAll('.cell').forEach(el => el.classList.remove('highlight-row', 'highlight-col', 'highlight-res'));
            
            // 행/열 하이라이트
            document.querySelectorAll(`.r${r}`).forEach(el => el.classList.add('highlight-row'));
            document.querySelectorAll(`.c${c}`).forEach(el => el.classList.add('highlight-col'));
            
            // 연산 과정 텍스트 생성
            let process = `C[${r+1},${c+1}] 계산 과정:<br>`;
            let terms = [];
            let result = 0;
            for(let k=0; k<2; k++) {
                let andVal = A[r][k] & B[k][c];
                terms.push(`(${A[r][k]} ∧ ${B[k][c]})`);
                result |= andVal;
            }
            process += terms.join(' ∨ ') + ` = <b>${result}</b>`;
            
            document.getElementById('stepBox').innerHTML = process;
            const resCells = document.querySelectorAll('.res');
            resCells[r * 2 + c].innerText = result;
            resCells[r * 2 + c].classList.add('highlight-res');
        }
    </script>
</body>
</html>
