<style>
  @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css");

<body>
<div class="app">
  <nav class="side">
    <h1>트리 알고리즘 실습실</h1>
    <p class="sub">로젠 이산수학 8판 · 11장 트리</p>
    <div class="navgrp"><p class="lab">11.3 트리 탐방</p>
      <button class="navbtn" data-mod="trav"><span class="sec">11.3</span>탐방 실습 (트리 편집)</button>
      <button class="navbtn" data-mod="expr"><span class="sec">11.3</span>수식 트리·표기법 실습</button>
      <button class="navbtn" data-mod="postfix"><span class="sec">11.3</span>후위 계산·변환 실습</button>
    </div>
    <div class="navgrp"><p class="lab">11.2 트리의 응용</p>
      <button class="navbtn" data-mod="bst"><span class="sec">11.2</span>이진 탐색 트리 실습</button>
      <button class="navbtn" data-mod="huffman"><span class="sec">11.2</span>허프만 코드 실습</button>
    </div>
    <div class="navgrp"><p class="lab">11.4 신장 트리</p>
      <button class="navbtn" data-mod="dfsbfs"><span class="sec">11.4</span>DFS·BFS 실습 (그래프 편집)</button>
    </div>
    <div class="navgrp"><p class="lab">11.5 최소 신장 트리</p>
      <button class="navbtn" data-mod="mst"><span class="sec">11.5</span>프림·크루스칼 실습</button>
    </div>
  </nav>
  <main class="main" id="main"></main>
</div>
<script>
/* ====================== 알고리즘 엔진 (순수 함수) ====================== */

/* ---- 1. 중위 수식 파서 (토크나이저 + 션팅야드 → 트리) ---- */
function tokenize(s){
  const t=[];let i=0;
  const prec={"+":1,"-":1,"*":2,"/":2,"^":3};
  while(i<s.length){
    const c=s[i];
    if(c===" "){i++;continue;}
    if("+-*/^".includes(c)){t.push({k:"op",v:c});i++;continue;}
    if(c==="("){t.push({k:"lp"});i++;continue;}
    if(c===")"){t.push({k:"rp"});i++;continue;}
    if(/[A-Za-z0-9_.]/.test(c)){
      let j=i;while(j<s.length&&/[A-Za-z0-9_.]/.test(s[j]))j++;
      t.push({k:"id",v:s.slice(i,j)});i=j;continue;
    }
    return {error:"알 수 없는 문자: '"+c+"'"};
  }
  return {tokens:t,prec:prec};
}
function parseInfix(s){
  const tk=tokenize(s);
  if(tk.error)return {error:tk.error};
  const {tokens,prec}=tk;
  const out=[],ops=[];
  const rightAssoc=c=>c==="^";
  for(const t of tokens){
    if(t.k==="id")out.push({op:false,label:t.v,l:null,r:null});
    else if(t.k==="op"){
      while(ops.length){
        const top=ops[ops.length-1];
        if(top.k==="op" && (prec[top.v]>prec[t.v] ||
           (prec[top.v]===prec[t.v] && !rightAssoc(t.v)))){
          pop();
        }else break;
      }
      ops.push(t);
    }else if(t.k==="lp")ops.push(t);
    else if(t.k==="rp"){
      while(ops.length && ops[ops.length-1].k!=="lp")pop();
      if(!ops.length)return {error:"괄호가 맞지 않는다."};
      ops.pop();
    }
  }
  while(ops.length){
    if(ops[ops.length-1].k==="lp")return {error:"괄호가 맞지 않는다."};
    pop();
  }
  function pop(){
    const o=ops.pop();
    if(out.length<2)return {error:"피연산자가 부족하다."};
    const r=out.pop(),l=out.pop();
    out.push({op:true,label:o.v,l,r});
  }
  if(out.length!==1)return {error:"수식 형태가 올바르지 않다."};
  return {tree:out[0]};
}
function traverse(t,order){ // 'pre' | 'in' | 'post'
  const o=[];
  (function go(n){
    if(!n)return;
    if(order==="pre")o.push(n.label);
    go(n.l);
    if(order==="in")o.push(n.label);
    go(n.r);
    if(order==="post")o.push(n.label);
  })(t);
  return o;
}
function infixString(t){ // 괄호 포함 중위
  return (function go(n){
    if(!n.op)return n.label;
    return "("+go(n.l)+" "+n.label+" "+go(n.r)+")";
  })(t);
}

/* ---- 2. 후위 계산 + 중위→후위 ---- */
function evalPostfix(tokens){
  const st=[],steps=[{stack:[],tok:-1,msg:"시작: 왼쪽부터 토큰을 읽는다."}];
  const isOp=x=>"+-*/^".includes(x);
  for(let i=0;i<tokens.length;i++){
    const t=tokens[i];
    if(isOp(t)){
      if(st.length<2)return {error:"연산자 "+t+" 앞에 피연산자가 부족하다."};
      const b=st.pop(),a=st.pop();
      let r;
      if(t==="+")r=a+b;else if(t==="-")r=a-b;else if(t==="*")r=a*b;
      else if(t==="/"){if(b===0)return {error:"0으로 나눌 수 없다."};r=a/b;}
      else r=Math.pow(a,b);
      st.push(r);
      steps.push({stack:[...st],tok:i,
        msg:"연산자 "+t+": 위의 두 값 "+a+", "+b+" 를 꺼내 "+a+" "+t+" "+b+" = "+r});
    }else{
      const v=Number(t);
      if(Number.isNaN(v))return {error:"피연산자가 숫자가 아니다: '"+t+"'"};
      st.push(v);
      steps.push({stack:[...st],tok:i,msg:"피연산자 "+t+" 를 스택에 쌓는다."});
    }
  }
  if(st.length!==1)return {error:"식이 완전하지 않다(남은 값 "+st.length+"개)."};
  return {steps,result:st[0]};
}
function infixToPostfix(s){
  const tk=tokenize(s);if(tk.error)return {error:tk.error};
  const {tokens,prec}=tk;const out=[],ops=[],steps=[];
  const rightAssoc=c=>c==="^";
  function snap(msg){steps.push({out:out.join(" "),ops:ops.map(o=>o.v||"(").join(" "),msg});}
  snap("시작");
  for(const t of tokens){
    if(t.k==="id"){out.push(t.v);snap("피연산자 "+t.v+" 는 곧바로 출력한다.");}
    else if(t.k==="op"){
      while(ops.length){const top=ops[ops.length-1];
        if(top.k==="op"&&(prec[top.v]>prec[t.v]||(prec[top.v]===prec[t.v]&&!rightAssoc(t.v)))){out.push(ops.pop().v);}
        else break;}
      ops.push(t);snap("연산자 "+t.v+" 는 우선순위를 비교한 뒤 스택에 넣는다.");
    }else if(t.k==="lp"){ops.push(t);snap("여는 괄호는 스택에 넣는다.");}
    else if(t.k==="rp"){
      while(ops.length&&ops[ops.length-1].k!=="lp")out.push(ops.pop().v);
      if(!ops.length)return {error:"괄호 불일치"};
      ops.pop();snap("닫는 괄호: 여는 괄호까지 연산자를 출력한다.");
    }
  }
  while(ops.length){if(ops[ops.length-1].k==="lp")return {error:"괄호 불일치"};out.push(ops.pop().v);}
  snap("남은 연산자를 모두 출력한다.");
  return {output:out,steps};
}

/* ---- 3. BST ---- */
function bstBuild(keys){
  let root=null;const steps=[];
  for(const k of keys){
    const path=[];
    if(root===null){root={k,l:null,r:null};steps.push({k,path:[],placed:k});continue;}
    let cur=root;
    while(true){path.push(cur.k);
      if(k===cur.k){steps.push({k,path:[...path],dup:true,placed:null});break;}
      if(k<cur.k){if(cur.l)cur=cur.l;else{cur.l={k,l:null,r:null};steps.push({k,path:[...path],placed:k});break;}}
      else{if(cur.r)cur=cur.r;else{cur.r={k,l:null,r:null};steps.push({k,path:[...path],placed:k});break;}}
    }
  }
  return {root,steps,height:bstHeight(root),count:bstCount(root)};
}
function bstHeight(n){return n?1+Math.max(bstHeight(n.l),bstHeight(n.r)):0;}
function bstCount(n){return n?1+bstCount(n.l)+bstCount(n.r):0;}
function bstSearch(root,key){
  const steps=[{cur:null,vis:[],msg:"루트에서 시작한다."}];
  let cur=root,vis=[],cmp=0;
  while(cur){vis.push(cur.k);cmp++;
    if(key===cur.k){steps.push({cur:cur.k,vis:[...vis],found:true,cmp,msg:key+" = "+cur.k+" : 찾았다. (비교 "+cmp+"회)"});return {steps,found:true,cmp};}
    const left=key<cur.k;
    steps.push({cur:cur.k,vis:[...vis],cmp,msg:key+(left?" < ":" > ")+cur.k+" → "+(left?"왼쪽":"오른쪽")+"으로 이동"});
    cur=left?cur.l:cur.r;
  }
  steps.push({cur:null,vis:[...vis],found:false,cmp,msg:key+" 를 찾지 못했다. (비교 "+cmp+"회)"});
  return {steps,found:false,cmp};
}

/* ---- 4. 허프만 ---- */
function huffman(freq){ // [[ch,w],...]
  if(freq.length<2)return {error:"문자가 2개 이상 필요하다."};
  let nodes=freq.map(([c,w],idx)=>({w,ch:c,l:null,r:null,_o:idx}));
  const steps=[{forest:snap(nodes),hl:[]}];
  let seq=freq.length;
  while(nodes.length>1){
    nodes.sort((a,b)=>a.w-b.w||a._o-b._o);
    const x=nodes.shift(),y=nodes.shift();
    const m={w:x.w+y.w,ch:null,l:x,r:y,_o:seq++};
    nodes.push(m);
    steps.push({forest:snap([...nodes].sort((a,b)=>a.w-b.w||a._o-b._o)),
      hl:[leaves(x),leaves(y)],merged:x.w+y.w,a:leaves(x),b:leaves(y),wa:x.w,wb:y.w});
  }
  const tree=nodes[0],codes={};
  (function go(n,c){if(!n)return;if(n.ch!==null){codes[n.ch]=c||"0";return;}go(n.l,c+"0");go(n.r,c+"1");})(tree,"");
  steps.push({final:true});
  const totBits=freq.reduce((s,[c,w])=>s+w*codes[c].length,0);
  const totW=freq.reduce((s,[c,w])=>s+w,0);
  const fixed=Math.ceil(Math.log2(freq.length))||1;
  return {tree,codes,steps,totBits,totW,fixed,avg:totBits/totW};
  function leaves(n){const o=[];(function g(m){if(!m)return;if(m.ch!==null)o.push(m.ch);g(m.l);g(m.r);})(n);return o.join("");}
  function snap(arr){return arr.map(n=>({w:n.w,leaves:leaves(n)}));}
}

/* ---- 5. DFS / BFS ---- */
function dfs(adj,start,asc){
  const vis=new Set(),tree=[],order=[],steps=[];
  const nb=v=>[...adj[v]].sort((a,b)=>asc?a.localeCompare(b):b.localeCompare(a));
  steps.push({vis:[],tree:[],cur:null,order:[],stack:[],msg:"DFS 시작: "+start});
  const stk=[];
  (function go(v,via){vis.add(v);order.push(v);stk.push(v);if(via)tree.push(via);
    steps.push({vis:[...vis],tree:tree.map(e=>e.join("")),cur:v,order:[...order],stack:[...stk],
      msg:(via?via.join("→")+" 로 ":"")+v+" 방문"});
    nb(v).forEach(w=>{if(!vis.has(w))go(w,[v,w]);});
    stk.pop();
  })(start,null);
  steps.push({vis:[...vis],tree:tree.map(e=>e.join("")),cur:null,order:[...order],stack:[],
    msg:"완료. 방문 순서 "+order.join(", ")});
  return {steps,order,tree:tree.map(e=>e.join(""))};
}
function bfs(adj,start,asc){
  const vis=new Set([start]),tree=[],order=[start],q=[start],steps=[];
  const nb=v=>[...adj[v]].sort((a,b)=>asc?a.localeCompare(b):b.localeCompare(a));
  steps.push({vis:[start],tree:[],cur:start,order:[start],queue:[start],msg:"BFS 시작: "+start+" 를 큐에 넣음"});
  while(q.length){const v=q.shift();const f=[];
    nb(v).forEach(w=>{if(!vis.has(w)){vis.add(w);tree.push([v,w]);order.push(w);q.push(w);f.push(w);}});
    steps.push({vis:[...vis],tree:tree.map(e=>e.join("")),cur:v,order:[...order],queue:[...q],
      msg:v+" 를 꺼냄. "+(f.length?"이웃 "+f.join(", ")+" 발견":"새 이웃 없음")});
  }
  steps.push({vis:[...vis],tree:tree.map(e=>e.join("")),cur:null,order:[...order],queue:[],
    msg:"완료. 방문 순서 "+order.join(", ")});
  return {steps,order,tree:tree.map(e=>e.join(""))};
}

/* ---- 6. 프림 / 크루스칼 (edges: [[a,b,w],...]) ---- */
function prim(verts,edges,start){
  const inT=new Set([start]),tree=[],steps=[];
  steps.push({inT:[start],tree:[],active:[],pick:null,msg:"프림 시작: "+start});
  while(inT.size<verts.length){
    const cross=edges.filter(([a,b])=>inT.has(a)!==inT.has(b)).sort((x,y)=>x[2]-y[2]);
    if(!cross.length)return {error:"그래프가 연결되어 있지 않다."};
    const p=cross[0],nv=inT.has(p[0])?p[1]:p[0];
    inT.add(nv);tree.push(p);
    steps.push({inT:[...inT],tree:tree.map(e=>e[0]+e[1]),active:cross.map(e=>e[0]+e[1]),pick:p[0]+p[1],
      msg:"횡단 간선 중 최소 "+p[0]+p[1]+"("+p[2]+") 선택 → "+nv+" 연결"});
  }
  const total=tree.reduce((s,e)=>s+e[2],0);
  steps.push({inT:[...inT],tree:tree.map(e=>e[0]+e[1]),active:[],pick:null,msg:"완료. 총 비용 "+total});
  return {steps,total,tree};
}
function kruskal(verts,edges){
  const sorted=[...edges].sort((a,b)=>a[2]-b[2]);
  const par={};verts.forEach(v=>par[v]=v);
  const find=x=>par[x]===x?x:(par[x]=find(par[x]));
  const tree=[],steps=[];
  steps.push({tree:[],row:-1,reject:null,comp:comp(),msg:"크루스칼 시작: 간선을 가중치 오름차순으로 본다."});
  sorted.forEach((e,i)=>{const[a,b,w]=e;const same=find(a)===find(b);
    if(!same){par[find(a)]=find(b);tree.push(e);}
    steps.push({tree:tree.map(x=>x[0]+x[1]),row:i,reject:same?a+b:null,comp:comp(),
      msg:same?a+b+"("+w+") 는 순환을 만들므로 버린다.":a+b+"("+w+") 선택, 두 성분을 합친다."});
  });
  const total=tree.reduce((s,e)=>s+e[2],0);
  steps.push({tree:tree.map(x=>x[0]+x[1]),row:sorted.length,reject:null,comp:comp(),msg:"완료. 총 비용 "+total});
  return {steps,total,tree,sorted};
  function comp(){const m={};verts.forEach(v=>{const r=find(v);(m[r]=m[r]||[]).push(v);});return Object.values(m).map(g=>g.sort().join(""));}
}

/* 스텝 플레이어 */
class Player{
  constructor(steps,render,refs){this.s=steps;this.render=render;this.r=refs;this.i=0;this.timer=null;this.bind();this.go(0);}
  bind(){const r=this.r;r.prev.onclick=()=>this.go(this.i-1);r.next.onclick=()=>this.go(this.i+1);
    r.reset.onclick=()=>{this.stop();this.go(0);};r.play.onclick=()=>this.toggle();}
  go(i){if(i<0||i>=this.s.length)return;this.i=i;this.render(this.s[i],i);
    const r=this.r;r.prev.disabled=i===0;r.next.disabled=i===this.s.length-1;
    r.bar.style.width=(i/(this.s.length-1||1)*100)+"%";r.no.textContent="단계 "+(i+1)+" / "+this.s.length;
    if(i===this.s.length-1)this.stop();}
  toggle(){this.timer?this.stop():this.play();}
  play(){this.r.play.textContent="일시정지";this.timer=setInterval(()=>{
    if(this.i>=this.s.length-1){this.stop();return;}this.go(this.i+1);},1000);}
  stop(){if(this.timer){clearInterval(this.timer);this.timer=null;}this.r.play.textContent="자동 재생";}
}

/* 일반 트리 레이아웃 (children[]) */
function layoutTree(root,W){
  const leaves=[];let maxd=0;
  (function col(n,d){n._d=d;maxd=Math.max(maxd,d);
    if(n.children.length)n.children.forEach(c=>col(c,d+1));else leaves.push(n);})(root,0);
  leaves.forEach((lf,i)=>lf._lx=i);
  (function setx(n){if(n.children.length){n.children.forEach(setx);
    n._lx=(n.children[0]._lx+n.children[n.children.length-1]._lx)/2;}})(root);
  const gap=Math.min(110,(W-90)/Math.max(1,leaves.length-1));
  const x0=(W-(leaves.length-1)*gap)/2;
  (function pos(n){n._x=x0+n._lx*gap;n._y=46+n._d*78;n.children.forEach(pos);})(root);
  return maxd;
}
function drawTree(svg,root,opts){
  opts=opts||{};clear(svg);
  (function ed(n){n.children.forEach(c=>{svgEdge(svg,n._x,n._y,c._x,c._y,"plain");ed(c);});})(root);
  (function dn(n){
    let st="none";
    if(opts.cur===n.id)st="current";else if(opts.done&&opts.done.has(n.id))st="done";
    if(opts.sel===n.id){svg.appendChild(E("circle",{cx:n._x,cy:n._y,r:27,fill:"none",
      stroke:"var(--accent)","stroke-width":2.5,"stroke-dasharray":"4 3"}));}
    svgNode(svg,n._x,n._y,n.label,st);
    if(opts.onClick){const hit=E("circle",{cx:n._x,cy:n._y,r:23,fill:"transparent",class:"selectable"});
      hit.addEventListener("click",()=>opts.onClick(n));svg.appendChild(hit);}
    n.children.forEach(dn);
  })(root);
}

function bstLayout(root,W){
  let i=0;(function ino(n,d){if(!n)return;ino(n.l,d+1);n._idx=i++;n._d=d;ino(n.r,d+1);})(root,0);
  const cnt=i;(function pos(n){if(!n)return;n._x=44+n._idx*((W-88)/Math.max(1,cnt-1));n._y=44+n._d*72;pos(n.l);pos(n.r);})(root);
}
function drawBST(svg,root,opts){opts=opts||{};clear(svg);
  (function ed(n){if(!n)return;if(n.l){svgEdge(svg,n._x,n._y,n.l._x,n.l._y,"plain");ed(n.l);}
    if(n.r){svgEdge(svg,n._x,n._y,n.r._x,n.r._y,"plain");ed(n.r);}})(root);
  (function dn(n){if(!n)return;const st=opts.cur===n.k?"current":(opts.vis&&opts.vis.includes(n.k))?"done":"none";
    svgNode(svg,n._x,n._y,String(n.k),st);dn(n.l);dn(n.r);})(root);}

  go.onclick=build;goStep.onclick=buildStep;sgo.onclick=search;
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")build();});
  build();

    (function sx(n){if(!n)return;if(n.ch===null){sx(n.l);sx(n.r);n._x=(n.l._x+n.r._x)/2;}})(t);

      +"<div class='it'><div class='n'>"+res.totBits+"</div><div class='l'>허프만 총 비트</div></div></div>"
      +"<p style='font-size:13px;color:#555;margin:10px 0 0'>고정 길이("+res.fixed+"비트) 코드라면 "+fixedBits+"비트가 필요하다. "

    },sp.refs);}

/* ===================== 그래프 편집기 (DFS/BFS·MST 공용) ===================== */
class GraphEditor{
  constructor(svg,weighted){this.svg=svg;this.weighted=weighted;this.mode="move";
    this.sel=null;this.drag=null;this.lastOpts={};this.onChange=null;
    this.nodes={};this.edges=[];this.statusEl=null;}
  setData(nodes,edges){this.nodes={};for(const k in nodes)this.nodes[k]={x:nodes[k][0],y:nodes[k][1]};
    this.edges=edges.map(e=>({a:e[0],b:e[1],w:e.length>2?e[2]:null}));this.sel=null;this.render();}
  verts(){return Object.keys(this.nodes);}
  adj(){const a={};this.verts().forEach(v=>a[v]=[]);this.edges.forEach(({a:x,b:y})=>{a[x].push(y);a[y].push(x);});return a;}
  edgeList(){return this.edges.map(e=>this.weighted?[e.a,e.b,e.w]:[e.a,e.b]);}
  setMode(mexp){this.mode=mexp;this.sel=null;if(this.statusEl)this.statusEl.textContent=
    mexp==="edge"?"간선 추가: 두 정점을 차례로 클릭하라.":mexp==="delv"?"정점 삭제: 지울 정점을 클릭하라.":"이동: 정점을 드래그하라.";
    this.render();}
  clientPt(evt){const p=this.svg.createSVGPoint();p.x=evt.clientX;p.y=evt.clientY;
    const m=this.svg.getScreenCTM();return m?p.matrixTransform(m.inverse()):{x:evt.clientX,y:evt.clientY};}
  addVertex(){const used=new Set(this.verts());let lab="A";for(let i=0;i<26;i++){const c=String.fromCharCode(65+i);if(!used.has(c)){lab=c;break;}}
    this.nodes[lab]=[120+Math.random()*400,90+Math.random()*220];this.nodes[lab]={x:120+Math.random()*400,y:90+Math.random()*220};
    this.changed();}
  delVertex(v){delete this.nodes[v];this.edges=this.edges.filter(e=>e.a!==v&&e.b!==v);this.sel=null;this.changed();}
  toggleEdge(a,b){if(a===b)return;const idx=this.edges.findIndex(e=>(e.a===a&&e.b===b)||(e.a===b&&e.b===a));
    if(idx>=0){this.edges.splice(idx,1);}
    else{let w=null;if(this.weighted){const v=prompt("간선 "+a+"-"+b+" 의 가중치:","1");if(v===null)return;w=Number(v);if(Number.isNaN(w))w=1;}
      this.edges.push({a,b,w});}this.changed();}
  editWeight(e){if(!this.weighted)return;const v=prompt("간선 "+e.a+"-"+e.b+" 가중치(빈칸이면 삭제):",e.w);
    if(v===null)return;if(v.trim()===""){this.edges=this.edges.filter(x=>x!==e);}else{const n=Number(v);if(!Number.isNaN(n))e.w=n;}this.changed();}
  changed(){this.render();if(this.onChange)this.onChange();}
  render(opts){opts=opts||this.lastOpts||{};this.lastOpts=opts;const svg=this.svg;clear(svg);
    const self=this;
    this.edges.forEach(e=>{const A=this.nodes[e.a],B=this.nodes[e.b];if(!A||!B)return;
      const st=opts.edgeState?opts.edgeState(e.a,e.b):"plain";
      svgEdge(svg,A.x,A.y,B.x,B.y,st,this.weighted?e.w:null);
      // 간선 클릭 영역(편집)
      if(!opts.lock&&this.mode==="move"){const hit=E("line",{x1:A.x,y1:A.y,x2:B.x,y2:B.y,
        stroke:"transparent","stroke-width":14,class:"selectable"});
        hit.addEventListener("click",()=>self.weighted?self.editWeight(e):self.toggleEdge(e.a,e.b));svg.appendChild(hit);}});
    this.verts().forEach(v=>{const n=this.nodes[v];
      let st=opts.nodeState?opts.nodeState(v):"none";
      if(this.sel===v){svg.appendChild(E("circle",{cx:n.x,cy:n.y,r:27,fill:"none",stroke:"var(--accent)","stroke-width":2.5,"stroke-dasharray":"4 3"}));}
      svgNode(svg,n.x,n.y,v,st);
      if(!opts.lock){const hit=E("circle",{cx:n.x,cy:n.y,r:23,fill:"transparent",
        class:this.mode==="move"?"draggable":"selectable"});
        hit.addEventListener("mousedown",ev=>self.onDown(ev,v));
        hit.addEventListener("click",ev=>self.onClick(ev,v));svg.appendChild(hit);}});
  }
  onDown(ev,v){if(this.mode!=="move")return;ev.preventDefault();const self=this;this.drag=v;
    const move=e=>{const p=self.clientPt(e);self.nodes[v].x=Math.max(30,Math.min(730,p.x));self.nodes[v].y=Math.max(30,Math.min(390,p.y));self.render(self.lastOpts);};
    const up=()=>{self.drag=null;window.removeEventListener("mousemove",move);window.removeEventListener("mouseup",up);};
    window.addEventListener("mousemove",move);window.addEventListener("mouseup",up);}
  onClick(ev,v){if(this.mode==="delv"){this.delVertex(v);return;}
    if(this.mode==="edge"){if(this.sel===null){this.sel=v;this.render();}
      else{const a=this.sel;this.sel=null;this.toggleEdge(a,v);if(this.statusEl)this.statusEl.textContent="간선 추가: 두 정점을 차례로 클릭하라.";}}}
}
function graphToolbar(ed,extra){
  const tb=H("div","toolbar");
  const bMove=H("button","btn small coral","이동"),bEdge=H("button","btn small ghost","간선 추가"),
    bAdd=H("button","btn small ghost","정점 추가"),bDel=H("button","btn small ghost","정점 삭제");
  function setBtns(){[ ["move",bMove],["edge",bEdge],["delv",bDel] ].forEach(([m,b])=>b.className="btn small "+(ed.mode===m?"coral":"ghost"));}
  bMove.onclick=()=>{ed.setMode("move");setBtns();};
  bEdge.onclick=()=>{ed.setMode("edge");setBtns();};
  bDel.onclick=()=>{ed.setMode("delv");setBtns();};
  bAdd.onclick=()=>{ed.addVertex();};
  tb.append(bMove,bEdge,bAdd,bDel);if(extra)extra.forEach(x=>tb.appendChild(x));
  return tb;
}

    const r=prim(V,EE,start);if(r.error){narr.innerHTML="<b>"+r.error+"</b>";return;}
    new Player(r.steps,(st,idx)=>{const tset=new Set(st.tree),aset=new Set(st.active);
      ed.render({lock:true,edgeState:(a,b)=>tset.has(a+b)||tset.has(b+a)?"tree":(st.pick===a+b||st.pick===b+a)?"tree":(aset.has(a+b)||aset.has(b+a))?"active":"plain",
        nodeState:v=>st.inT.includes(v)?"done":"none"});
      narr.innerHTML=st.msg;const cost=showCost(st.tree);
      sel.innerHTML=(st.tree.join(", ")||"<span style='color:#bbb'>아직 없음</span>")+"<div style='font-size:13px;color:#555;margin-top:6px'>누적 비용 = <b style='color:var(--accent)'>"+cost+"</b>"+(idx===r.steps.length-1?" (완성)":"")+"</div>";
    },sp.refs);
    interp.innerHTML="<h4>결과 해석</h4>프림은 현재 트리에서 바깥으로 나가는(횡단) 간선 중 가장 가벼운 것을 고른다. "
      +"이는 컷 성질로 정당화된다. 총 비용은 <b>"+r.total+"</b> 이다. 크루스칼도 실행해 같은 비용인지 비교하라.";}
  function runKruskal(){const V=ed.verts(),EE=ed.edgeList();const r=kruskal(V,EE);
    let th="<table class='mini'><tr><th>순서</th><th>간선</th><th>가중치</th><th>판단</th></tr>";
    r.sorted.forEach((e,i)=>th+="<tr id='kr"+i+"'><td>"+(i+1)+"</td><td>"+e[0]+e[1]+"</td><td>"+e[2]+"</td><td id='krs"+i+"'>—</td></tr>");
    th+="</table>";krt.innerHTML=th;
    new Player(r.steps,(st,idx)=>{const tset=new Set(st.tree);
      const colOf={};st.comp.forEach((grp,gi)=>grp.split("").forEach(v=>colOf[v]=COLORS[gi%COLORS.length]));
      ed.render({lock:true,edgeState:(a,b)=>tset.has(a+b)||tset.has(b+a)?"tree":(st.reject===a+b||st.reject===b+a)?"active":"plain",
        nodeState:v=>st.comp.length>=ed.verts().length?"none":(colOf[v]||"none")});
      narr.innerHTML=st.msg;const cost=showCost(st.tree);
      sel.innerHTML=(st.tree.join(", ")||"<span style='color:#bbb'>아직 없음</span>")+"<div style='font-size:13px;color:#555;margin-top:6px'>누적 비용 = <b style='color:var(--accent)'>"+cost+"</b>"+(idx===r.steps.length-1?" (완성)":"")+"</div>";
      r.sorted.forEach((e,i)=>{const tr=$("kr"+i),sc=$("krs"+i);if(!tr)return;tr.className=i===st.row?"hl":"";
        if(i<=st.row){const acc=tset.has(e[0]+e[1])||tset.has(e[1]+e[0]);sc.textContent=acc?"선택":"버림(순환)";sc.style.color=acc?"var(--try-fg)":"var(--warn-fg)";}
        else{sc.textContent="—";sc.style.color="#aaa";}});
    },sp.refs);
    interp.innerHTML="<h4>결과 해석</h4>크루스칼은 가장 싼 간선부터 보되 같은 성분을 잇는(순환을 만드는) 간선만 건너뛴다. "
      +"총 비용은 <b>"+r.total+"</b> 이다. 프림과 같은 비용에 도달했는지 확인하라.";}
  bP.onclick=runPrim;bK.onclick=runKruskal;
}

const MODS={trav:MOD_trav,expr:MOD_expr,postfix:MOD_postfix,bst:MOD_bst,huffman:MOD_huffman,dfsbfs:MOD_dfsbfs,mst:MOD_mst};
const HOME=[

  ["expr","11.3","수식 트리·표기법 실습","중위 수식을 입력해 트리를 만들고 세 표기법을 직접 비교한다."],
  ["postfix","11.3","후위 계산·변환 실습","후위식을 입력해 스택으로 계산하거나 중위식을 후위식으로 변환한다."],
  ["bst","11.2","이진 탐색 트리 실습","삽입 순서를 바꿔 가며 트리 높이와 탐색 비교 횟수의 변화를 관찰한다."],
  ["huffman","11.2","허프만 코드 실습","빈도표를 편집해 압축 트리와 절감률이 어떻게 달라지는지 실험한다."],
  ["dfsbfs","11.4","DFS·BFS 실습 (그래프 편집)","그래프를 직접 그리고 시작점·이웃 순서를 바꿔 두 탐색을 비교한다."],
  ["mst","11.5","프림·크루스칼 실습","가중치를 편집하며 두 알고리즘이 같은 최소 비용에 이르는지 검증한다."],
];
function showHome(){const m=$("main");clear(m);
  header(m,"로젠 이산수학 8판 · 11장 트리","트리 알고리즘 실습실",
    "이 실습실의 모든 도구는 학생이 직접 입력하고 편집하며 실행하도록 만들어졌다. 트리와 그래프를 자기 손으로 만들고, 값을 바꿔 가며 결과가 어떻게 달라지는지 해석하는 것이 목표이다. 각 도구에는 직접 해 볼 탐구 과제가 함께 있다.");
  const grid=H("div","home-grid");
  HOME.forEach(([id,sec,t,d])=>{const c=H("div","home-card");
    c.innerHTML="<div class='s'>"+sec+"</div><div class='t'>"+t+"</div><div class='d'>"+d+"</div>";
    c.onclick=()=>select(id);grid.appendChild(c);});
  m.appendChild(grid);
  m.appendChild(H("div","note","모든 도구는 입력값을 자유롭게 바꿀 수 있다. 잘못된 입력에는 안내 메시지가 나타나며, 기본 예시는 학생 안내노트·워크북의 예제와 같은 값으로 맞추어 두었다."));
}
function select(id){document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("on",b.dataset.mod===id));
  MODS[id]();window.scrollTo(0,0);}
document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>select(b.dataset.mod));
showHome();
