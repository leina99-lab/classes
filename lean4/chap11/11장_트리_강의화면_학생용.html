<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>11장 트리 — 강의 화면</title>
<style>
:root{--bg:#fff;--fg:#2b2b2b;--muted:#7BA7AD;--deep:#2D5E5E;--accent:#D4726A;
 --soft:#F0F5F4;--thm:#E0F0ED;--demo:#FDF0E6;--demofg:#B85F3D;--break:#EAF2F1;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
 background:#1f2a2a;color:var(--fg);overflow:hidden;}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:3vh 3vw;}
.slide{display:none;width:100%;max-width:1100px;height:88vh;background:var(--bg);
 border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.4);padding:5vh 5vw;
 flex-direction:column;overflow:hidden;}
.slide.active{display:flex;}
.kick{font-size:1.5vw;font-weight:800;color:var(--muted);letter-spacing:2px;}
h1{font-size:4.6vw;font-weight:900;color:#1d1d1d;line-height:1.1;margin:1vh 0;}
h2{font-size:3.2vw;font-weight:900;color:var(--deep);line-height:1.15;margin-bottom:2vh;}
.sub{font-size:2.2vw;color:var(--accent);font-weight:800;}
ul{list-style:none;margin-top:1vh;}
li{font-size:2.05vw;line-height:1.7;padding-left:1.4em;position:relative;color:#333;margin:.4vh 0;}
li::before{content:"";position:absolute;left:0;top:.75em;width:.55em;height:.55em;
 background:var(--muted);border-radius:50%;}
.body{flex:1;display:flex;gap:3vw;align-items:center;min-height:0;}
.body .txt{flex:1;}
.body img{max-height:64vh;max-width:46%;object-fit:contain;border-radius:14px;
 border:1px solid #e3e3e3;padding:1vh;background:#fff;}
.full-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.part{background:linear-gradient(135deg,var(--deep),var(--muted));}
.part .kick,.part h1,.part .sub{color:#fff;}
.part{align-items:center;justify-content:center;text-align:center;}
.brk{background:var(--break);align-items:center;justify-content:center;text-align:center;}
.brk h1{color:var(--deep);font-size:6vw;}
.demo-tag{display:inline-block;background:var(--demo);color:var(--demofg);
 font-size:1.5vw;font-weight:900;padding:.5vh 1.4vw;border-radius:999px;margin-bottom:1.5vh;}
.demo h2{color:var(--demofg);}
.demo li::before{background:var(--accent);}
#bar{position:fixed;left:0;bottom:0;height:6px;background:var(--accent);width:0;transition:width .2s;}
#cnt{position:fixed;right:18px;bottom:14px;color:#cfe0df;font-size:14px;font-weight:700;}
#hint{position:fixed;left:18px;bottom:12px;color:#9fb6b5;font-size:12px;}
.nav{position:fixed;top:0;bottom:0;width:18%;cursor:pointer;z-index:5;}
#prev{left:0;} #next{right:0;}
</style></head><body>
<div id="stage"></div>
<div id="prev" class="nav"></div><div id="next" class="nav"></div>
<div id="bar"></div><div id="cnt"></div>
<div id="hint">← → 또는 좌우 클릭으로 이동</div>

function esc(t){return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function render(){
 stage.innerHTML='';
 S.forEach((s,idx)=>{
  const d=document.createElement('div');d.className='slide'+(idx===i?' active':'');
  let inner='';
  const pts=(s.points||[]).map(p=>'<li>'+esc(p)+'</li>').join('');
  if(s.t==='title'){d.classList.add('part');
    inner='<div class="full-center"><div class="kick">로젠 이산수학 8판</div><h1>'+esc(s.head)+'</h1><div class="sub">'+esc(s.sub)+'</div><ul style="margin-top:3vh;color:#eaf6f4">'+pts+'</ul></div>';}
  else if(s.t==='part'){d.classList.add('part');
    inner='<div class="full-center"><div class="kick">'+esc(s.head)+'</div><h1>'+esc(s.sub)+'</h1></div>';}
  else if(s.t==='break'){d.classList.add('brk');
    inner='<div class="full-center"><h1>'+esc(s.head)+'</h1><div class="sub" style="font-size:2.6vw;margin-top:2vh">'+esc(s.sub)+'</div></div>';}
  else if(s.t==='demo'){d.classList.add('demo');
    inner='<span class="demo-tag">시연</span><h2>'+esc(s.sub)+'</h2><div class="body"><div class="txt"><ul>'+pts+'</ul></div></div>';}
  else if(s.t==='summary'){
    inner='<h2>'+esc(s.head)+'</h2><div class="body"><div class="txt"><ul>'+pts+'</ul></div></div>';}
  else{ // concept
    const img=s.fig?'<img src="'+s.fig+'">':'';
    inner='<h2>'+esc(s.head)+'</h2><div class="body"><div class="txt"><ul>'+pts+'</ul></div>'+img+'</div>';}
  d.innerHTML=inner;stage.appendChild(d);
 });
 document.getElementById('bar').style.width=((i+1)/S.length*100)+'%';
 document.getElementById('cnt').textContent=(i+1)+' / '+S.length;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));render();}
document.getElementById('next').onclick=()=>go(i+1);
document.getElementById('prev').onclick=()=>go(i-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')go(i+1);
 else if(e.key==='ArrowLeft'||e.key==='PageUp')go(i-1);else if(e.key==='Home')go(0);else if(e.key==='End')go(S.length-1);});
render();
</script></body></html>
