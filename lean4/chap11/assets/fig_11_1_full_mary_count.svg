<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340">
<rect class="bg" x="0" y="0" width="820" height="340"/>

<style>
  .bg { fill: #ffffff; }
  .panel { fill: #f8fafc; stroke: #d0d7de; stroke-width: 1; rx: 10; }
  .edge { stroke: #334155; stroke-width: 2.2; fill: none; }
  .edge2 { stroke: #64748b; stroke-width: 1.7; fill: none; }
  .selected { stroke: #2563eb; stroke-width: 4; fill: none; }
  .skip { stroke: #ef4444; stroke-width: 2.5; stroke-dasharray: 6 4; fill: none; }
  .cut { stroke: #9333ea; stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
  .node { fill: #ffffff; stroke: #0f172a; stroke-width: 2; }
  .node2 { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; }
  .node3 { fill: #fef3c7; stroke: #92400e; stroke-width: 2; }
  .node4 { fill: #dcfce7; stroke: #166534; stroke-width: 2; }
  .leaf { fill: #f0fdf4; stroke: #166534; stroke-width: 2; }
  .bad { fill: #fee2e2; stroke: #991b1b; stroke-width: 2; }
  .text { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 15px; fill: #0f172a; }
  .small { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 12px; fill: #334155; }
  .tiny { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 10px; fill: #475569; }
  .title { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
  .label { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 13px; fill: #1e293b; }
  .weight { font-family: DejaVu Sans, Arial, sans-serif; font-size: 13px; fill: #0f172a; font-weight: 700; }
</style>

<text class="title" x="25" y="35" text-anchor="start">Counting edges in a full m-ary tree</text>
<line class="edge" x1="160" y1="80" x2="80" y2="160"/>
<line class="edge" x1="160" y1="80" x2="160" y2="160"/>
<line class="edge" x1="160" y1="80" x2="240" y2="160"/>
<line class="edge" x1="80" y1="160" x2="40" y2="245"/>
<line class="edge" x1="80" y1="160" x2="80" y2="245"/>
<line class="edge" x1="80" y1="160" x2="120" y2="245"/>
<line class="edge" x1="240" y1="160" x2="200" y2="245"/>
<line class="edge" x1="240" y1="160" x2="240" y2="245"/>
<line class="edge" x1="240" y1="160" x2="280" y2="245"/>
<circle class="node3" cx="160" cy="80" r="16"/>
<text class="text" x="160" y="85" text-anchor="middle">r</text>
<circle class="node3" cx="80" cy="160" r="16"/>
<text class="text" x="80" y="165" text-anchor="middle">a</text>
<circle class="leaf" cx="160" cy="160" r="16"/>
<text class="text" x="160" y="165" text-anchor="middle">b</text>
<circle class="node3" cx="240" cy="160" r="16"/>
<text class="text" x="240" y="165" text-anchor="middle">c</text>
<circle class="leaf" cx="40" cy="245" r="16"/>
<text class="text" x="40" y="250" text-anchor="middle">d</text>
<circle class="leaf" cx="80" cy="245" r="16"/>
<text class="text" x="80" y="250" text-anchor="middle">e</text>
<circle class="leaf" cx="120" cy="245" r="16"/>
<text class="text" x="120" y="250" text-anchor="middle">f</text>
<circle class="leaf" cx="200" cy="245" r="16"/>
<text class="text" x="200" y="250" text-anchor="middle">g</text>
<circle class="leaf" cx="240" cy="245" r="16"/>
<text class="text" x="240" y="250" text-anchor="middle">h</text>
<circle class="leaf" cx="280" cy="245" r="16"/>
<text class="text" x="280" y="250" text-anchor="middle">i</text>
<text class="text" x="350" y="95" text-anchor="start">Each internal vertex has exactly m children.</text>
<text class="text" x="350" y="135" text-anchor="start">If there are i internal vertices, child edges are m i.</text>
<text class="text" x="350" y="175" text-anchor="start">A tree with n vertices has n - 1 edges.</text>
<text class="text" x="350" y="220" text-anchor="start">Therefore n - 1 = m i and n = m i + 1.</text>
<text class="text" x="350" y="260" text-anchor="start">With n = i + l, leaves satisfy l = (m - 1)i + 1.</text>
</svg>