<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
<rect class="bg" x="0" y="0" width="900" height="300"/>

<style>
  .bg { fill: #ffffff; }
  .panel { fill: #f8fafc; stroke: #d0d7de; stroke-width: 1; rx: 10; }
  .edge { stroke: #334155; stroke-width: 2.2; fill: none; }
  .edge2 { stroke: #64748b; stroke-width: 1.7; fill: none; }
  .selected { stroke: #2563eb; stroke-width: 4; fill: none; }
  .skip { stroke: #ef4444; stroke-width: 2.5; stroke-dasharray: 6 4; fill: none; }
  .cut { stroke: #9333ea; stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
  .node { fill: #ffffff; stroke: #0f172a; stroke-width: 2; }
  .node2 { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; }
  .node3 { fill: #fef3c7; stroke: #92400e; stroke-width: 2; }
  .node4 { fill: #dcfce7; stroke: #166534; stroke-width: 2; }
  .leaf { fill: #f0fdf4; stroke: #166534; stroke-width: 2; }
  .bad { fill: #fee2e2; stroke: #991b1b; stroke-width: 2; }
  .text { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 15px; fill: #0f172a; }
  .small { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 12px; fill: #334155; }
  .tiny { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 10px; fill: #475569; }
  .title { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
  .label { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 13px; fill: #1e293b; }
  .weight { font-family: DejaVu Sans, Arial, sans-serif; font-size: 13px; fill: #0f172a; font-weight: 700; }
</style>

<text class="title" x="25" y="35" text-anchor="start">Tree = connected and acyclic</text>
<text class="title" x="325" y="35" text-anchor="start">Not a tree: cycle exists</text>
<text class="title" x="635" y="35" text-anchor="start">Not a tree: disconnected</text>
<rect class="panel" x="15" y="55" width="260" height="215"/>
<rect class="panel" x="310" y="55" width="260" height="215"/>
<rect class="panel" x="620" y="55" width="260" height="215"/>
<line class="edge" x1="145" y1="85" x2="85" y2="145"/>
<line class="edge" x1="145" y1="85" x2="205" y2="145"/>
<line class="edge" x1="85" y1="145" x2="55" y2="215"/>
<line class="edge" x1="85" y1="145" x2="115" y2="215"/>
<line class="edge" x1="205" y1="145" x2="205" y2="215"/>
<circle class="node" cx="145" cy="85" r="16"/>
<text class="text" x="145" y="90" text-anchor="middle">a</text>
<circle class="node" cx="85" cy="145" r="16"/>
<text class="text" x="85" y="150" text-anchor="middle">b</text>
<circle class="node" cx="205" cy="145" r="16"/>
<text class="text" x="205" y="150" text-anchor="middle">c</text>
<circle class="node" cx="55" cy="215" r="16"/>
<text class="text" x="55" y="220" text-anchor="middle">d</text>
<circle class="node" cx="115" cy="215" r="16"/>
<text class="text" x="115" y="220" text-anchor="middle">e</text>
<circle class="node" cx="205" cy="215" r="16"/>
<text class="text" x="205" y="220" text-anchor="middle">f</text>
<text class="small" x="50" y="255" text-anchor="start">6 vertices, 5 edges, one piece</text>
<line class="edge" x1="440" y1="95" x2="380" y2="175"/>
<line class="edge" x1="380" y1="175" x2="440" y2="235"/>
<line class="edge" x1="440" y1="235" x2="500" y2="175"/>
<line class="edge" x1="500" y1="175" x2="440" y2="95"/>
<line class="skip" x1="380" y1="175" x2="500" y2="175"/>
<circle class="node" cx="440" cy="95" r="16"/>
<text class="text" x="440" y="100" text-anchor="middle">a</text>
<circle class="bad" cx="380" cy="175" r="16"/>
<text class="text" x="380" y="180" text-anchor="middle">b</text>
<circle class="bad" cx="500" cy="175" r="16"/>
<text class="text" x="500" y="180" text-anchor="middle">c</text>
<circle class="node" cx="440" cy="235" r="16"/>
<text class="text" x="440" y="240" text-anchor="middle">d</text>
<text class="small" x="350" y="255" text-anchor="start">A loop-free graph cannot contain a cycle</text>
<line class="edge" x1="690" y1="115" x2="750" y2="185"/>
<line class="edge" x1="750" y1="185" x2="660" y2="215"/>
<line class="edge" x1="825" y1="120" x2="835" y2="210"/>
<circle class="node" cx="690" cy="115" r="16"/>
<text class="text" x="690" y="120" text-anchor="middle">a</text>
<circle class="node" cx="750" cy="185" r="16"/>
<text class="text" x="750" y="190" text-anchor="middle">b</text>
<circle class="node" cx="660" cy="215" r="16"/>
<text class="text" x="660" y="220" text-anchor="middle">c</text>
<circle class="node" cx="825" cy="120" r="16"/>
<text class="text" x="825" y="125" text-anchor="middle">d</text>
<circle class="node" cx="835" cy="210" r="16"/>
<text class="text" x="835" y="215" text-anchor="middle">e</text>
<text class="small" x="650" y="255" text-anchor="start">Each component is a tree, so it is a forest</text>
</svg>