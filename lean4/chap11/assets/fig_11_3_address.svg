<svg xmlns="http://www.w3.org/2000/svg" width="850" height="400" viewBox="0 0 850 400">
<rect class="bg" x="0" y="0" width="850" height="400"/>

<style>
  .bg { fill: #ffffff; }
  .panel { fill: #f8fafc; stroke: #d0d7de; stroke-width: 1; rx: 10; }
  .edge { stroke: #334155; stroke-width: 2.2; fill: none; }
  .edge2 { stroke: #64748b; stroke-width: 1.7; fill: none; }
  .selected { stroke: #2563eb; stroke-width: 4; fill: none; }
  .skip { stroke: #ef4444; stroke-width: 2.5; stroke-dasharray: 6 4; fill: none; }
  .cut { stroke: #9333ea; stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
  .node { fill: #ffffff; stroke: #0f172a; stroke-width: 2; }
  .node2 { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; }
  .node3 { fill: #fef3c7; stroke: #92400e; stroke-width: 2; }
  .node4 { fill: #dcfce7; stroke: #166534; stroke-width: 2; }
  .leaf { fill: #f0fdf4; stroke: #166534; stroke-width: 2; }
  .bad { fill: #fee2e2; stroke: #991b1b; stroke-width: 2; }
  .text { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 15px; fill: #0f172a; }
  .small { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 12px; fill: #334155; }
  .tiny { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 10px; fill: #475569; }
  .title { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
  .label { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 13px; fill: #1e293b; }
  .weight { font-family: DejaVu Sans, Arial, sans-serif; font-size: 13px; fill: #0f172a; font-weight: 700; }
</style>

<text class="title" x="25" y="35" text-anchor="start">Universal address system for an ordered rooted tree</text>
<line class="edge2" x1="425" y1="70" x2="210" y2="145"/>
<line class="edge2" x1="425" y1="70" x2="425" y2="145"/>
<line class="edge2" x1="425" y1="70" x2="640" y2="145"/>
<line class="edge2" x1="210" y1="145" x2="125" y2="240"/>
<line class="edge2" x1="210" y1="145" x2="250" y2="240"/>
<line class="edge2" x1="425" y1="145" x2="370" y2="240"/>
<line class="edge2" x1="425" y1="145" x2="480" y2="240"/>
<line class="edge2" x1="640" y1="145" x2="595" y2="240"/>
<line class="edge2" x1="640" y1="145" x2="700" y2="240"/>
<line class="edge2" x1="370" y1="240" x2="330" y2="330"/>
<line class="edge2" x1="370" y1="240" x2="410" y2="330"/>
<circle class="node2" cx="425" cy="70" r="20"/>
<text class="text" x="425" y="75" text-anchor="middle">root</text>
<circle class="node" cx="210" cy="145" r="20"/>
<text class="text" x="210" y="150" text-anchor="middle">1</text>
<circle class="node" cx="425" cy="145" r="20"/>
<text class="text" x="425" y="150" text-anchor="middle">2</text>
<circle class="node" cx="640" cy="145" r="20"/>
<text class="text" x="640" y="150" text-anchor="middle">3</text>
<circle class="node" cx="125" cy="240" r="20"/>
<text class="text" x="125" y="245" text-anchor="middle">1.1</text>
<circle class="node" cx="250" cy="240" r="20"/>
<text class="text" x="250" y="245" text-anchor="middle">1.2</text>
<circle class="node" cx="370" cy="240" r="20"/>
<text class="text" x="370" y="245" text-anchor="middle">2.1</text>
<circle class="node" cx="480" cy="240" r="20"/>
<text class="text" x="480" y="245" text-anchor="middle">2.2</text>
<circle class="node" cx="595" cy="240" r="20"/>
<text class="text" x="595" y="245" text-anchor="middle">3.1</text>
<circle class="node" cx="700" cy="240" r="20"/>
<text class="text" x="700" y="245" text-anchor="middle">3.2</text>
<circle class="node" cx="330" cy="330" r="20"/>
<text class="text" x="330" y="335" text-anchor="middle">2.1.1</text>
<circle class="node" cx="410" cy="330" r="20"/>
<text class="text" x="410" y="335" text-anchor="middle">2.1.2</text>
<text class="small" x="62" y="370" text-anchor="start">Address 2.1.2 means: second child, then first child, then second child.</text>
</svg>