<line class="selected" x1="190" y1="350" x2="250" y2="395"/>
<line class="selected" x1="560" y1="350" x2="670" y2="330"/>
<line class="selected" x1="670" y1="330" x2="720" y2="390"/>
<line class="selected" x1="300" y1="330" x2="560" y2="350"/>
