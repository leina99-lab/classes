<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400">
<rect class="bg" x="0" y="0" width="760" height="400"/>

<style>
  .bg { fill: #ffffff; }
  .panel { fill: #f8fafc; stroke: #d0d7de; stroke-width: 1; rx: 10; }
  .edge { stroke: #334155; stroke-width: 2.2; fill: none; }
  .edge2 { stroke: #64748b; stroke-width: 1.7; fill: none; }
  .selected { stroke: #2563eb; stroke-width: 4; fill: none; }
  .skip { stroke: #ef4444; stroke-width: 2.5; stroke-dasharray: 6 4; fill: none; }
  .cut { stroke: #9333ea; stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
  .node { fill: #ffffff; stroke: #0f172a; stroke-width: 2; }
  .node2 { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; }
  .node3 { fill: #fef3c7; stroke: #92400e; stroke-width: 2; }
  .node4 { fill: #dcfce7; stroke: #166534; stroke-width: 2; }
  .leaf { fill: #f0fdf4; stroke: #166534; stroke-width: 2; }
  .bad { fill: #fee2e2; stroke: #991b1b; stroke-width: 2; }
  .text { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 15px; fill: #0f172a; }
  .small { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 12px; fill: #334155; }
  .tiny { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 10px; fill: #475569; }
  .title { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
  .label { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 13px; fill: #1e293b; }
  .weight { font-family: DejaVu Sans, Arial, sans-serif; font-size: 13px; fill: #0f172a; font-weight: 700; }
</style>

<line class="edge" x1="400" y1="60" x2="250" y2="145"/>
<line class="edge" x1="400" y1="60" x2="550" y2="145"/>
<line class="edge" x1="250" y1="145" x2="170" y2="235"/>
<line class="edge" x1="250" y1="145" x2="330" y2="235"/>
<line class="edge" x1="550" y1="145" x2="620" y2="235"/>
<line class="edge" x1="330" y1="235" x2="285" y2="320"/>
<line class="edge" x1="330" y1="235" x2="375" y2="320"/>
<line class="edge" x1="620" y1="235" x2="580" y2="320"/>
<circle class="node" cx="400" cy="60" r="18"/>
<text class="text" x="400" y="65" text-anchor="middle">8</text>
<circle class="node" cx="250" cy="145" r="18"/>
<text class="text" x="250" y="150" text-anchor="middle">3</text>
<circle class="node" cx="550" cy="145" r="18"/>
<text class="text" x="550" y="150" text-anchor="middle">10</text>
<circle class="node" cx="170" cy="235" r="18"/>
<text class="text" x="170" y="240" text-anchor="middle">1</text>
<circle class="node" cx="330" cy="235" r="18"/>
<text class="text" x="330" y="240" text-anchor="middle">6</text>
<circle class="node" cx="620" cy="235" r="18"/>
<text class="text" x="620" y="240" text-anchor="middle">14</text>
<circle class="node" cx="285" cy="320" r="18"/>
<text class="text" x="285" y="325" text-anchor="middle">4</text>
<circle class="node" cx="375" cy="320" r="18"/>
<text class="text" x="375" y="325" text-anchor="middle">7</text>
<circle class="node" cx="580" cy="320" r="18"/>
<text class="text" x="580" y="325" text-anchor="middle">13</text>
<text class="title" x="30" y="45" text-anchor="start">Binary search tree after inserting 8, 3, 10, 1, 6, 14, 4, 7, 13</text>
<text class="small" x="70" y="365" text-anchor="start">Left child contains smaller keys; right child contains larger keys.</text>
</svg>
