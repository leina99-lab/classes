<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380">
<rect class="bg" x="0" y="0" width="640" height="380"/>

<style>
  .bg { fill: #ffffff; }
  .panel { fill: #f8fafc; stroke: #d0d7de; stroke-width: 1; rx: 10; }
  .edge { stroke: #334155; stroke-width: 2.2; fill: none; }
  .edge2 { stroke: #64748b; stroke-width: 1.7; fill: none; }
  .selected { stroke: #2563eb; stroke-width: 4; fill: none; }
  .skip { stroke: #ef4444; stroke-width: 2.5; stroke-dasharray: 6 4; fill: none; }
  .cut { stroke: #9333ea; stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
  .node { fill: #ffffff; stroke: #0f172a; stroke-width: 2; }
  .node2 { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; }
  .node3 { fill: #fef3c7; stroke: #92400e; stroke-width: 2; }
  .node4 { fill: #dcfce7; stroke: #166534; stroke-width: 2; }
  .leaf { fill: #f0fdf4; stroke: #166534; stroke-width: 2; }
  .bad { fill: #fee2e2; stroke: #991b1b; stroke-width: 2; }
  .text { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 15px; fill: #0f172a; }
  .small { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 12px; fill: #334155; }
  .tiny { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 10px; fill: #475569; }
  .title { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
  .label { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 13px; fill: #1e293b; }
  .weight { font-family: DejaVu Sans, Arial, sans-serif; font-size: 13px; fill: #0f172a; font-weight: 700; }
</style>

<text class="title" x="20" y="30" text-anchor="start">Rooted tree vocabulary</text>
<line class="edge" x1="320" y1="70" x2="190" y2="150"/>
<line class="edge" x1="320" y1="70" x2="320" y2="150"/>
<line class="edge" x1="320" y1="70" x2="450" y2="150"/>
<line class="edge" x1="190" y1="150" x2="130" y2="235"/>
<line class="edge" x1="190" y1="150" x2="250" y2="235"/>
<line class="edge" x1="450" y1="150" x2="390" y2="235"/>
<line class="edge" x1="450" y1="150" x2="510" y2="235"/>
<line class="edge" x1="250" y1="235" x2="220" y2="320"/>
<line class="edge" x1="250" y1="235" x2="280" y2="320"/>
<circle class="node2" cx="320" cy="70" r="18"/>
<text class="text" x="320" y="75" text-anchor="middle">r</text>
<circle class="node" cx="190" cy="150" r="18"/>
<text class="text" x="190" y="155" text-anchor="middle">a</text>
<circle class="node" cx="320" cy="150" r="18"/>
<text class="text" x="320" y="155" text-anchor="middle">b</text>
<circle class="node" cx="450" cy="150" r="18"/>
<text class="text" x="450" y="155" text-anchor="middle">c</text>
<circle class="leaf" cx="130" cy="235" r="18"/>
<text class="text" x="130" y="240" text-anchor="middle">d</text>
<circle class="node" cx="250" cy="235" r="18"/>
<text class="text" x="250" y="240" text-anchor="middle">e</text>
<circle class="leaf" cx="390" cy="235" r="18"/>
<text class="text" x="390" y="240" text-anchor="middle">f</text>
<circle class="leaf" cx="510" cy="235" r="18"/>
<text class="text" x="510" y="240" text-anchor="middle">g</text>
<circle class="leaf" cx="220" cy="320" r="18"/>
<text class="text" x="220" y="325" text-anchor="middle">h</text>
<circle class="leaf" cx="280" cy="320" r="18"/>
<text class="text" x="280" y="325" text-anchor="middle">i</text>
<text class="label" x="380" y="74" text-anchor="start">root</text>
<text class="label" x="72" y="240" text-anchor="start">leaves</text>
<text class="small" x="285" y="238" text-anchor="start">siblings h and i share parent e</text>
<text class="tiny" x="360" y="155" text-anchor="start">level 1</text>
<text class="tiny" x="360" y="235" text-anchor="start">level 2</text>
<text class="tiny" x="360" y="320" text-anchor="start">level 3</text>
</svg>
