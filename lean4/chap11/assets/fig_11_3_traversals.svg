<svg xmlns="http://www.w3.org/2000/svg" width="850" height="410" viewBox="0 0 850 410">
<rect class="bg" x="0" y="0" width="850" height="410"/>

<style>
  .bg { fill: #ffffff; }
  .panel { fill: #f8fafc; stroke: #d0d7de; stroke-width: 1; rx: 10; }
  .edge { stroke: #334155; stroke-width: 2.2; fill: none; }
  .edge2 { stroke: #64748b; stroke-width: 1.7; fill: none; }
  .selected { stroke: #2563eb; stroke-width: 4; fill: none; }
  .skip { stroke: #ef4444; stroke-width: 2.5; stroke-dasharray: 6 4; fill: none; }
  .cut { stroke: #9333ea; stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
  .node { fill: #ffffff; stroke: #0f172a; stroke-width: 2; }
  .node2 { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; }
  .node3 { fill: #fef3c7; stroke: #92400e; stroke-width: 2; }
  .node4 { fill: #dcfce7; stroke: #166534; stroke-width: 2; }
  .leaf { fill: #f0fdf4; stroke: #166534; stroke-width: 2; }
  .bad { fill: #fee2e2; stroke: #991b1b; stroke-width: 2; }
  .text { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 15px; fill: #0f172a; }
  .small { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 12px; fill: #334155; }
  .tiny { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 10px; fill: #475569; }
  .title { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
  .label { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 13px; fill: #1e293b; }
  .weight { font-family: DejaVu Sans, Arial, sans-serif; font-size: 13px; fill: #0f172a; font-weight: 700; }
</style>

<text class="title" x="25" y="35" text-anchor="start">Traversal orders on an ordered rooted tree</text>
<line class="edge" x1="425" y1="70" x2="230" y2="150"/>
<line class="edge" x1="425" y1="70" x2="425" y2="150"/>
<line class="edge" x1="425" y1="70" x2="620" y2="150"/>
<line class="edge" x1="230" y1="150" x2="160" y2="250"/>
<line class="edge" x1="230" y1="150" x2="300" y2="250"/>
<line class="edge" x1="425" y1="150" x2="425" y2="250"/>
<line class="edge" x1="620" y1="150" x2="560" y2="250"/>
<line class="edge" x1="620" y1="150" x2="680" y2="250"/>
<circle class="node2" cx="425" cy="70" r="18"/>
<text class="text" x="425" y="75" text-anchor="middle">A</text>
<circle class="node" cx="230" cy="150" r="18"/>
<text class="text" x="230" y="155" text-anchor="middle">B</text>
<circle class="node" cx="425" cy="150" r="18"/>
<text class="text" x="425" y="155" text-anchor="middle">C</text>
<circle class="node" cx="620" cy="150" r="18"/>
<text class="text" x="620" y="155" text-anchor="middle">D</text>
<circle class="node" cx="160" cy="250" r="18"/>
<text class="text" x="160" y="255" text-anchor="middle">E</text>
<circle class="node" cx="300" cy="250" r="18"/>
<text class="text" x="300" y="255" text-anchor="middle">F</text>
<circle class="node" cx="425" cy="250" r="18"/>
<text class="text" x="425" y="255" text-anchor="middle">G</text>
<circle class="node" cx="560" cy="250" r="18"/>
<text class="text" x="560" y="255" text-anchor="middle">H</text>
<circle class="node" cx="680" cy="250" r="18"/>
<text class="text" x="680" y="255" text-anchor="middle">I</text>
<text class="small" x="60" y="330" text-anchor="start">Preorder: A B E F C G D H I</text>
<text class="small" x="60" y="355" text-anchor="start">Postorder: E F B G C H I D A</text>
<text class="small" x="60" y="380" text-anchor="start">Rule: preorder visits a node before its subtrees; postorder visits it after its subtrees.</text>
</svg>