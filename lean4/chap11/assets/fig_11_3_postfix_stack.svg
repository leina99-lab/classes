<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
<rect class="bg" x="0" y="0" width="900" height="360"/>

<style>
  .bg { fill: #ffffff; }
  .panel { fill: #f8fafc; stroke: #d0d7de; stroke-width: 1; rx: 10; }
  .edge { stroke: #334155; stroke-width: 2.2; fill: none; }
  .edge2 { stroke: #64748b; stroke-width: 1.7; fill: none; }
  .selected { stroke: #2563eb; stroke-width: 4; fill: none; }
  .skip { stroke: #ef4444; stroke-width: 2.5; stroke-dasharray: 6 4; fill: none; }
  .cut { stroke: #9333ea; stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
  .node { fill: #ffffff; stroke: #0f172a; stroke-width: 2; }
  .node2 { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; }
  .node3 { fill: #fef3c7; stroke: #92400e; stroke-width: 2; }
  .node4 { fill: #dcfce7; stroke: #166534; stroke-width: 2; }
  .leaf { fill: #f0fdf4; stroke: #166534; stroke-width: 2; }
  .bad { fill: #fee2e2; stroke: #991b1b; stroke-width: 2; }
  .text { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 15px; fill: #0f172a; }
  .small { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 12px; fill: #334155; }
  .tiny { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 10px; fill: #475569; }
  .title { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
  .label { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 13px; fill: #1e293b; }
  .weight { font-family: DejaVu Sans, Arial, sans-serif; font-size: 13px; fill: #0f172a; font-weight: 700; }
</style>

<text class="title" x="25" y="35" text-anchor="start">Evaluating postfix expression 2 3 + 4 5 - *</text>
<rect class="node2" x="55" y="90" width="80" height="36" rx="8"/>
<text class="text" x="95.0" y="113.0" text-anchor="middle">2</text>
<text class="tiny" x="95" y="152" text-anchor="middle">push 2</text>
<rect class="leaf" x="75" y="250" width="40" height="28" rx="8"/>
<text class="text" x="95.0" y="269.0" text-anchor="middle">2</text>
<line class="edge2" x1="135" y1="108" x2="160" y2="108"/>
<rect class="node2" x="175" y="90" width="80" height="36" rx="8"/>
<text class="text" x="215.0" y="113.0" text-anchor="middle">3</text>
<text class="tiny" x="215" y="152" text-anchor="middle">push 3</text>
<rect class="leaf" x="195" y="250" width="40" height="28" rx="8"/>
<text class="text" x="215.0" y="269.0" text-anchor="middle">2</text>
<rect class="leaf" x="195" y="220" width="40" height="28" rx="8"/>
<text class="text" x="215.0" y="239.0" text-anchor="middle">3</text>
<line class="edge2" x1="255" y1="108" x2="280" y2="108"/>
<rect class="node2" x="295" y="90" width="80" height="36" rx="8"/>
<text class="text" x="335.0" y="113.0" text-anchor="middle">+</text>
<text class="tiny" x="335" y="152" text-anchor="middle">pop 2,3 -&gt; 5</text>
<rect class="leaf" x="315" y="250" width="40" height="28" rx="8"/>
<text class="text" x="335.0" y="269.0" text-anchor="middle">5</text>
<line class="edge2" x1="375" y1="108" x2="400" y2="108"/>
<rect class="node2" x="415" y="90" width="80" height="36" rx="8"/>
<text class="text" x="455.0" y="113.0" text-anchor="middle">4</text>
<text class="tiny" x="455" y="152" text-anchor="middle">push 4</text>
<rect class="leaf" x="435" y="250" width="40" height="28" rx="8"/>
<text class="text" x="455.0" y="269.0" text-anchor="middle">5</text>
<rect class="leaf" x="435" y="220" width="40" height="28" rx="8"/>
<text class="text" x="455.0" y="239.0" text-anchor="middle">4</text>
<line class="edge2" x1="495" y1="108" x2="520" y2="108"/>
<rect class="node2" x="535" y="90" width="80" height="36" rx="8"/>
<text class="text" x="575.0" y="113.0" text-anchor="middle">5</text>
<text class="tiny" x="575" y="152" text-anchor="middle">push 5</text>
<rect class="leaf" x="555" y="250" width="40" height="28" rx="8"/>
<text class="text" x="575.0" y="269.0" text-anchor="middle">5</text>
<rect class="leaf" x="555" y="220" width="40" height="28" rx="8"/>
<text class="text" x="575.0" y="239.0" text-anchor="middle">4</text>
<rect class="leaf" x="555" y="190" width="40" height="28" rx="8"/>
<text class="text" x="575.0" y="209.0" text-anchor="middle">5</text>
<line class="edge2" x1="615" y1="108" x2="640" y2="108"/>
<rect class="node2" x="655" y="90" width="80" height="36" rx="8"/>
<text class="text" x="695.0" y="113.0" text-anchor="middle">-</text>
<text class="tiny" x="695" y="152" text-anchor="middle">pop 4,5 -&gt; -1</text>
<rect class="leaf" x="675" y="250" width="40" height="28" rx="8"/>
<text class="text" x="695.0" y="269.0" text-anchor="middle">5</text>
<rect class="leaf" x="675" y="220" width="40" height="28" rx="8"/>
<text class="text" x="695.0" y="239.0" text-anchor="middle">-1</text>
<line class="edge2" x1="735" y1="108" x2="760" y2="108"/>
<rect class="node2" x="775" y="90" width="80" height="36" rx="8"/>
<text class="text" x="815.0" y="113.0" text-anchor="middle">*</text>
<text class="tiny" x="815" y="152" text-anchor="middle">pop 5,-1 -&gt; -5</text>
<rect class="leaf" x="795" y="250" width="40" height="28" rx="8"/>
<text class="text" x="815.0" y="269.0" text-anchor="middle">-5</text>
<text class="small" x="50" y="335" text-anchor="start">An operator acts on the two most recent values, which explains why a stack is natural.</text>
</svg>