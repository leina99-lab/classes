<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360">
<rect class="bg" x="0" y="0" width="720" height="360"/>

<style>
  .bg { fill: #ffffff; }
  .panel { fill: #f8fafc; stroke: #d0d7de; stroke-width: 1; rx: 10; }
  .edge { stroke: #334155; stroke-width: 2.2; fill: none; }
  .edge2 { stroke: #64748b; stroke-width: 1.7; fill: none; }
  .selected { stroke: #2563eb; stroke-width: 4; fill: none; }
  .skip { stroke: #ef4444; stroke-width: 2.5; stroke-dasharray: 6 4; fill: none; }
  .cut { stroke: #9333ea; stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
  .node { fill: #ffffff; stroke: #0f172a; stroke-width: 2; }
  .node2 { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; }
  .node3 { fill: #fef3c7; stroke: #92400e; stroke-width: 2; }
  .node4 { fill: #dcfce7; stroke: #166534; stroke-width: 2; }
  .leaf { fill: #f0fdf4; stroke: #166534; stroke-width: 2; }
  .bad { fill: #fee2e2; stroke: #991b1b; stroke-width: 2; }
  .text { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 15px; fill: #0f172a; }
  .small { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 12px; fill: #334155; }
  .tiny { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 10px; fill: #475569; }
  .title { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
  .label { font-family: DejaVu Sans, Noto Sans CJK KR, Arial, sans-serif; font-size: 13px; fill: #1e293b; }
  .weight { font-family: DejaVu Sans, Arial, sans-serif; font-size: 13px; fill: #0f172a; font-weight: 700; }
</style>

<text class="title" x="25" y="35" text-anchor="start">Prefix code tree: only leaves are complete codewords</text>
<line class="edge" x1="360" y1="75" x2="230" y2="160"/>
<rect x="283.0" y="106.5" width="24" height="18" rx="4" fill="#fff" opacity="0.9"/>
<text class="weight" x="295.0" y="122.5" text-anchor="middle">0</text>
<line class="edge" x1="360" y1="75" x2="490" y2="160"/>
<rect x="413.0" y="106.5" width="24" height="18" rx="4" fill="#fff" opacity="0.9"/>
<text class="weight" x="425.0" y="122.5" text-anchor="middle">1</text>
<line class="edge" x1="230" y1="160" x2="160" y2="250"/>
<rect x="183.0" y="194.0" width="24" height="18" rx="4" fill="#fff" opacity="0.9"/>
<text class="weight" x="195.0" y="210.0" text-anchor="middle">0</text>
<line class="edge" x1="230" y1="160" x2="300" y2="250"/>
<rect x="253.0" y="194.0" width="24" height="18" rx="4" fill="#fff" opacity="0.9"/>
<text class="weight" x="265.0" y="210.0" text-anchor="middle">1</text>
<line class="edge" x1="490" y1="160" x2="430" y2="250"/>
<rect x="448.0" y="194.0" width="24" height="18" rx="4" fill="#fff" opacity="0.9"/>
<text class="weight" x="460.0" y="210.0" text-anchor="middle">0</text>
<line class="edge" x1="490" y1="160" x2="550" y2="250"/>
<rect x="508.0" y="194.0" width="24" height="18" rx="4" fill="#fff" opacity="0.9"/>
<text class="weight" x="520.0" y="210.0" text-anchor="middle">1</text>
<circle class="node" cx="360" cy="75" r="18"/>
<circle class="node" cx="230" cy="160" r="18"/>
<circle class="node" cx="490" cy="160" r="18"/>
<circle class="leaf" cx="160" cy="250" r="18"/>
<text class="text" x="160" y="255" text-anchor="middle">A</text>
<circle class="leaf" cx="300" cy="250" r="18"/>
<text class="text" x="300" y="255" text-anchor="middle">B</text>
<circle class="leaf" cx="430" cy="250" r="18"/>
<text class="text" x="430" y="255" text-anchor="middle">C</text>
<circle class="leaf" cx="550" cy="250" r="18"/>
<text class="text" x="550" y="255" text-anchor="middle">D</text>
<text class="small" x="70" y="325" text-anchor="start">No leaf lies below another leaf, so no codeword can be a prefix of another.</text>
</svg>