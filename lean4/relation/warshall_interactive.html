<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>와샬 알고리즘 단계별 시각화 — 편집 가능</title>
<style>
:root {
  --bg-primary: #ffffff;
  --bg-secondary: #f4f4f3;
  --bg-tertiary: #ebebe9;
  --bg-info: #E6F1FB;
  --bg-warning: #FAEEDA;
  --bg-success: #EAF3DE;
  --text-primary: #1a1a1a;
  --text-secondary: #5f5f5b;
  --text-tertiary: #989894;
  --text-info: #185FA5;
  --text-warning: #854F0B;
  --text-success: #3B6D11;
  --border-tertiary: rgba(0, 0, 0, 0.12);
  --border-secondary: rgba(0, 0, 0, 0.2);
  --border-info: #185FA5;
  --border-success: #3B6D11;
  --radius-md: 8px;
  --radius-lg: 12px;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "SF Mono", Consolas, "Liberation Mono", monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-primary: #1d1d1c;
    --bg-secondary: #2a2a28;
    --bg-tertiary: #353532;
    --bg-info: #042C53;
    --bg-warning: #412402;
    --bg-success: #173404;
    --text-primary: #f4f4f3;
    --text-secondary: #b8b8b3;
    --text-tertiary: #6f6f6c;
    --text-info: #B5D4F4;
    --text-warning: #FAC775;
    --text-success: #C0DD97;
    --border-tertiary: rgba(255, 255, 255, 0.15);
    --border-secondary: rgba(255, 255, 255, 0.25);
    --border-info: #378ADD;
    --border-success: #639922;
  }
}

* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 2rem 1rem;
  font-family: var(--font-sans);
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.5;
}
.outer { max-width: 720px; margin: 0 auto; }
h1 {
  font-size: 22px;
  font-weight: 500;
  margin: 0 0 0.5rem;
}
.sub {
  font-size: 14px;
  color: var(--text-secondary);
  margin: 0 0 1.5rem;
}
button {
  font-family: inherit;
  font-size: 13px;
  color: var(--text-primary);
  background: transparent;
  border: 0.5px solid var(--border-secondary);
  border-radius: var(--radius-md);
  padding: 0 12px;
  height: 32px;
  cursor: pointer;
  transition: all 0.15s;
}
button:hover { background: var(--bg-secondary); }
button:active { transform: scale(0.98); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
select {
  font-family: inherit;
  font-size: 13px;
  color: var(--text-primary);
  background: var(--bg-primary);
  border: 0.5px solid var(--border-secondary);
  border-radius: var(--radius-md);
  padding: 0 8px;
  height: 30px;
  cursor: pointer;
}

.w2-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; padding: 10px 12px; background: var(--bg-secondary); border-radius: var(--radius-md); }
.w2-toolbar label { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
.w2-toolbar select { width: 60px; }
.w2-toolbar .sep { width: 1px; height: 20px; background: var(--border-tertiary); margin: 0 4px; }
.w2-edit-hint { font-size: 12px; color: var(--text-info); margin-left: auto; }
.w2-edit-hint.locked { color: var(--text-tertiary); }
.w2-dots { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.w2-dot { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; background: var(--bg-secondary); color: var(--text-secondary); border: 0.5px solid var(--border-tertiary); cursor: pointer; transition: all 0.2s; }
.w2-dot.active { background: var(--bg-info); color: var(--text-info); border-color: var(--border-info); }
.w2-dot.done { background: var(--bg-success); color: var(--text-success); border-color: var(--border-success); }
.w2-label { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
.w2-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.6; min-height: 40px; margin-bottom: 1rem; }
.w2-main { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 1rem; }
@media (max-width: 600px) {
  .w2-main { grid-template-columns: 1fr; }
}
.w2-card { background: var(--bg-secondary); border-radius: var(--radius-lg); padding: 12px; }
.w2-card-title { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; font-weight: 500; }
.w2-matrix { border-collapse: collapse; font-family: var(--font-mono); font-size: 13px; margin: 0 auto; }
.w2-matrix th, .w2-matrix td { text-align: center; }
.w2-matrix th { font-weight: 500; color: var(--text-secondary); border: none; }
.w2-matrix td { border: 0.5px solid var(--border-tertiary); transition: all 0.3s; background: var(--bg-primary); }
.w2-cell-1 { color: var(--text-primary); font-weight: 500; }
.w2-cell-0 { color: var(--text-tertiary); }
.w2-cell-new { background: var(--bg-warning) !important; color: var(--text-warning); font-weight: 500; }
.w2-k-row { background: var(--bg-info) !important; }
.w2-k-col { background: var(--bg-info) !important; }
.w2-k-cross { background: #B5D4F4 !important; color: var(--text-info) !important; }
.w2-cell-diag { background: var(--bg-tertiary) !important; color: var(--text-tertiary); }
.w2-editable { cursor: pointer; }
.w2-editable:hover { background: #FAC775 !important; }
.w2-rule { background: var(--bg-secondary); border-radius: var(--radius-md); padding: 10px 12px; font-size: 13px; line-height: 1.6; min-height: 50px; margin-bottom: 0.75rem; border-left: 3px solid var(--border-info); }
.w2-rule code { font-family: var(--font-mono); background: var(--bg-primary); padding: 1px 5px; border-radius: 3px; font-size: 12px; }
.w2-controls { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
.w2-controls button { min-width: 90px; height: 34px; }
.w2-graph { width: 100%; height: 220px; background: var(--bg-primary); border-radius: var(--radius-md); }
.footer { margin-top: 2rem; font-size: 12px; color: var(--text-tertiary); text-align: center; }
</style>
</head>
<body>
<div class="outer">
  <h1>와샬 알고리즘 단계별 시각화</h1>
  <p class="sub">정점 수와 초기 관계 R 을 자유롭게 바꿔가며 추이폐포가 어떻게 만들어지는지 확인할 수 있다.</p>

  <div class="w2-toolbar">
    <label>정점 <select id="w2-size">
      <option value="3">3</option>
      <option value="4" selected>4</option>
      <option value="5">5</option>
      <option value="6">6</option>
    </select></label>
    <div class="sep"></div>
    <button id="w2-pat-chain">직선</button>
    <button id="w2-pat-cycle">고리</button>
    <button id="w2-pat-random">무작위</button>
    <button id="w2-pat-clear">빈 행렬</button>
    <div class="w2-edit-hint" id="w2-edit-hint">행렬 칸 클릭으로 R 편집</div>
  </div>

  <div class="w2-dots" id="w2-dots"></div>
  <div class="w2-label" id="w2-label">단계 0 — 초기 관계 R</div>
  <div class="w2-desc" id="w2-desc">정점 수와 패턴을 고르거나 행렬 칸을 직접 클릭해 R 을 만든 뒤 "다음" 으로 와샬을 시작.</div>

  <div class="w2-main">
    <div class="w2-card">
      <div class="w2-card-title">유향 그래프</div>
      <svg class="w2-graph" id="w2-graph" viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="w2-arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L9,4.5 L0,9 z" fill="#444"/>
          </marker>
          <marker id="w2-arr-new" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L9,4.5 L0,9 z" fill="#D85A30"/>
          </marker>
        </defs>
        <g id="w2-edges"></g>
        <g id="w2-vertices"></g>
      </svg>
    </div>
    <div class="w2-card">
      <div class="w2-card-title">관계행렬 W<sub id="w2-k-sub">0</sub></div>
      <div style="display: flex; justify-content: center; align-items: center; min-height: 200px;">
        <table class="w2-matrix" id="w2-matrix"></table>
      </div>
    </div>
  </div>

  <div class="w2-rule" id="w2-rule">초기 상태. 행렬 칸을 클릭해 R 을 편집한 뒤 다음 단계로 진행.</div>

  <div class="w2-controls">
    <button id="w2-btn-reset">↺ 처음으로</button>
    <button id="w2-btn-prev">← 이전</button>
    <button id="w2-btn-next">다음 →</button>
    <button id="w2-btn-auto">▶ 자동 재생</button>
  </div>

  <div class="footer">
    로젠 이산수학 8판 5.6절 와샬 알고리즘 · Lean 4 통합 강의 부속 자료
  </div>
</div>

<script>
(function() {
  const NAMES = ['a', 'b', 'c', 'd', 'e', 'f'];
  let N = 4;
  let initial = [];
  let states = [];
  let changes = [];
  let routes = [];
  let step = 0;
  let timer = null;

  function makeChain(n) {
    const M = Array.from({length: n}, () => Array(n).fill(0));
    for (let i = 0; i < n - 1; i++) M[i][i+1] = 1;
    return M;
  }
  function makeCycle(n) {
    const M = makeChain(n);
    M[n-1][0] = 1;
    return M;
  }
  function makeRandom(n) {
    const M = Array.from({length: n}, () => Array(n).fill(0));
    for (let i = 0; i < n; i++)
      for (let j = 0; j < n; j++)
        if (i !== j && Math.random() < 0.32) M[i][j] = 1;
    return M;
  }
  function makeClear(n) {
    return Array.from({length: n}, () => Array(n).fill(0));
  }

  function computeStates() {
    states = [initial.map(r => [...r])];
    changes = [[]];
    routes = [[]];
    for (let k = 0; k < N; k++) {
      const prev = states[k];
      const next = prev.map(r => [...r]);
      const ch = [];
      const rt = [];
      for (let i = 0; i < N; i++)
        for (let j = 0; j < N; j++)
          if (next[i][j] === 0 && prev[i][k] === 1 && prev[k][j] === 1) {
            next[i][j] = 1;
            ch.push([i, j]);
            rt.push([i, k, j]);
          }
      states.push(next);
      changes.push(ch);
      routes.push(rt);
    }
  }

  function vertexPositions() {
    const cx = 160, cy = 110;
    const r = N <= 3 ? 55 : N === 4 ? 70 : 80;
    const pos = {};
    for (let i = 0; i < N; i++) {
      const angle = -Math.PI / 2 + (2 * Math.PI * i) / N;
      pos[NAMES[i]] = {
        x: cx + r * Math.cos(angle),
        y: cy + r * Math.sin(angle)
      };
    }
    return pos;
  }

  function edgePath(p1, p2, hasReverse) {
    const dx = p2.x - p1.x, dy = p2.y - p1.y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    const R = 18;
    const ux = dx / dist, uy = dy / dist;
    if (!hasReverse) {
      const sx = p1.x + ux * R;
      const sy = p1.y + uy * R;
      const ex = p2.x - ux * (R + 4);
      const ey = p2.y - uy * (R + 4);
      return 'M ' + sx.toFixed(1) + ',' + sy.toFixed(1) + ' L ' + ex.toFixed(1) + ',' + ey.toFixed(1);
    } else {
      const offset = 16;
      const nx = -uy, ny = ux;
      const cosA = 0.95, sinA = 0.31;
      const u2x = ux * cosA - uy * sinA;
      const u2y = ux * sinA + uy * cosA;
      const sx = p1.x + u2x * R;
      const sy = p1.y + u2y * R;
      const u3x = ux * cosA + uy * sinA;
      const u3y = -ux * sinA + uy * cosA;
      const ex = p2.x - u3x * (R + 4);
      const ey = p2.y - u3y * (R + 4);
      const mx = (p1.x + p2.x) / 2 + nx * offset;
      const my = (p1.y + p2.y) / 2 + ny * offset;
      return 'M ' + sx.toFixed(1) + ',' + sy.toFixed(1) + ' Q ' + mx.toFixed(1) + ',' + my.toFixed(1) + ' ' + ex.toFixed(1) + ',' + ey.toFixed(1);
    }
  }

  function renderGraph() {
    const M = states[step];
    const ch = changes[step];
    const pos = vertexPositions();
    let edgesHtml = '';
    for (let i = 0; i < N; i++) {
      for (let j = 0; j < N; j++) {
        if (i !== j && M[i][j] === 1) {
          const hasReverse = M[j][i] === 1;
          const isNew = ch.some(([ci, cj]) => ci === i && cj === j);
          const color = isNew ? '#D85A30' : '#444';
          const sw = isNew ? 2.2 : 1.4;
          const marker = isNew ? 'w2-arr-new' : 'w2-arr';
          edgesHtml += '<path d="' + edgePath(pos[NAMES[i]], pos[NAMES[j]], hasReverse) + '" stroke="' + color + '" stroke-width="' + sw + '" fill="none" marker-end="url(#' + marker + ')" opacity="' + (isNew ? 1 : 0.85) + '"/>';
        }
      }
    }
    document.getElementById('w2-edges').innerHTML = edgesHtml;

    const currK = step > 0 ? step - 1 : -1;
    let vertHtml = '';
    for (let i = 0; i < N; i++) {
      const p = pos[NAMES[i]];
      const isK = (i === currK);
      const fill = isK ? '#B5D4F4' : '#fff';
      const stroke = isK ? '#185FA5' : '#333';
      const sw = isK ? 2.5 : 1.5;
      vertHtml += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="18" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + sw + '"/>';
      vertHtml += '<text x="' + p.x.toFixed(1) + '" y="' + p.y.toFixed(1) + '" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#333">' + NAMES[i] + '</text>';
    }
    document.getElementById('w2-vertices').innerHTML = vertHtml;
  }

  function renderMatrix() {
    const M = states[step];
    const ch = changes[step];
    const currK = step > 0 ? step - 1 : -1;
    const cellW = N <= 4 ? 34 : N === 5 ? 30 : 26;
    let html = '<thead><tr><th style="width:' + cellW + 'px;"></th>';
    for (let j = 0; j < N; j++) {
      const isK = (j === currK);
      html += '<th style="width:' + cellW + 'px;' + (isK ? 'color:#185FA5;font-weight:700;' : '') + '">' + NAMES[j] + '</th>';
    }
    html += '</tr></thead><tbody>';
    for (let i = 0; i < N; i++) {
      const isKRow = (i === currK);
      html += '<tr><th style="width:' + cellW + 'px;' + (isKRow ? 'color:#185FA5;font-weight:700;' : '') + '">' + NAMES[i] + '</th>';
      for (let j = 0; j < N; j++) {
        const val = M[i][j];
        const isDiag = (i === j);
        const isNew = ch.some(([ci, cj]) => ci === i && cj === j);
        const isKCol = (j === currK);
        let cls;
        if (isDiag) cls = 'w2-cell-diag';
        else cls = val === 1 ? 'w2-cell-1' : 'w2-cell-0';
        if (isNew) cls = 'w2-cell-new';
        else if (isKRow && isKCol) cls += ' w2-k-cross';
        else if (isKRow) cls += ' w2-k-row';
        else if (isKCol) cls += ' w2-k-col';
        if (step === 0 && !isDiag) cls += ' w2-editable';
        html += '<td class="' + cls + '" data-i="' + i + '" data-j="' + j + '" style="width:' + cellW + 'px;height:' + cellW + 'px;">' + val + '</td>';
      }
      html += '</tr>';
    }
    html += '</tbody>';
    document.getElementById('w2-matrix').innerHTML = html;
    document.getElementById('w2-k-sub').textContent = step;

    if (step === 0) {
      document.getElementById('w2-matrix').addEventListener('click', cellClickHandler);
    }
  }

  function cellClickHandler(e) {
    if (step !== 0) return;
    const td = e.target.closest('td');
    if (!td || !td.dataset.i) return;
    const i = +td.dataset.i, j = +td.dataset.j;
    if (i === j) return;
    initial[i][j] = 1 - initial[i][j];
    computeStates();
    update();
  }

  function renderDots() {
    let html = '';
    for (let k = 0; k <= N; k++) {
      let cls = 'w2-dot';
      if (k === step) cls += ' active';
      else if (k < step) cls += ' done';
      html += '<div class="' + cls + '" data-k="' + k + '">' + k + '</div>';
    }
    document.getElementById('w2-dots').innerHTML = html;
    document.querySelectorAll('.w2-dot').forEach((d, i) => {
      d.addEventListener('click', () => { step = i; stopAuto(); update(); });
    });
  }

  function getLabel() {
    if (step === 0) return '단계 0 — 초기 관계 R';
    if (step === N) return '단계 ' + step + ' — 정점 ' + NAMES[step-1] + ' 경유지 허용 (완료)';
    return '단계 ' + step + ' — 정점 ' + NAMES[step-1] + ' 를 경유지로 허용';
  }

  function getDesc() {
    if (step === 0) {
      const edges = [];
      for (let i = 0; i < N; i++)
        for (let j = 0; j < N; j++)
          if (i !== j && initial[i][j] === 1) edges.push('(' + NAMES[i] + ', ' + NAMES[j] + ')');
      if (edges.length === 0) return '비어 있는 관계 R. 행렬 칸을 클릭해 간선을 추가하거나 위쪽 패턴 버튼을 사용한다.';
      return '초기 관계 R 의 간선 ' + edges.length + ' 개. 행렬 칸을 클릭해 추가·제거할 수 있다. 다음 버튼으로 와샬을 시작.';
    }
    if (step === N) return '모든 ' + N + ' 개 정점이 경유지로 허용됐다. W' + step + ' 가 곧 추이폐포 t(R) 의 관계행렬이다.';
    const k = NAMES[step-1];
    return '정점 ' + k + ' 를 경유지로 허용. ' + k + ' 를 거치는 새 우회로가 있다면 (i, j) 칸이 새로 1 이 된다.';
  }

  function getRule() {
    if (step === 0) return '초기 상태. 행렬 칸을 클릭해 R 을 편집하거나 위쪽 패턴 버튼으로 빠르게 채운 뒤 다음 단계로.';
    const rt = routes[step];
    if (rt.length === 0) {
      const k = NAMES[step-1];
      return '<b>변화 없음.</b> 정점 <code>' + k + '</code> 를 경유지로 허용했지만 <code>' + k + '</code> 를 거치는 새 우회로가 없다. W<sub>' + step + '</sub> = W<sub>' + (step-1) + '</sub>.';
    }
    const strs = rt.slice(0, 4).map(([i, k, j]) => '<code>' + NAMES[i] + ' → ' + NAMES[k] + ' → ' + NAMES[j] + '</code>');
    const cells = rt.slice(0, 4).map(([i, k, j]) => '<code>(' + NAMES[i] + ', ' + NAMES[j] + ')</code>');
    let suffix = '';
    if (rt.length > 4) suffix = ' ... 총 ' + rt.length + ' 개 우회로 발견.';
    return '<b>우회로 발견.</b> ' + strs.join(', ') + ' 을(를) 통해 ' + cells.join(', ') + ' 가(이) 새로 1.' + suffix;
  }

  function update() {
    document.getElementById('w2-label').textContent = getLabel();
    document.getElementById('w2-desc').textContent = getDesc();
    document.getElementById('w2-rule').innerHTML = getRule();
    document.getElementById('w2-btn-prev').disabled = (step === 0);
    document.getElementById('w2-btn-next').disabled = (step === N);
    const hint = document.getElementById('w2-edit-hint');
    if (step === 0) {
      hint.textContent = '행렬 칸 클릭으로 R 편집';
      hint.classList.remove('locked');
    } else {
      hint.textContent = '편집 잠금 (처음으로 가서 편집)';
      hint.classList.add('locked');
    }
    renderDots();
    renderMatrix();
    renderGraph();
  }

  function stopAuto() {
    if (timer) {
      clearInterval(timer);
      timer = null;
      document.getElementById('w2-btn-auto').textContent = '▶ 자동 재생';
    }
  }

  function reinit(pattern) {
    N = +document.getElementById('w2-size').value;
    if (pattern === 'chain') initial = makeChain(N);
    else if (pattern === 'cycle') initial = makeCycle(N);
    else if (pattern === 'random') initial = makeRandom(N);
    else if (pattern === 'clear') initial = makeClear(N);
    step = 0;
    stopAuto();
    computeStates();
    update();
  }

  initial = makeChain(4);
  computeStates();
  update();

  document.getElementById('w2-size').addEventListener('change', () => reinit('chain'));
  document.getElementById('w2-pat-chain').addEventListener('click', () => reinit('chain'));
  document.getElementById('w2-pat-cycle').addEventListener('click', () => reinit('cycle'));
  document.getElementById('w2-pat-random').addEventListener('click', () => reinit('random'));
  document.getElementById('w2-pat-clear').addEventListener('click', () => reinit('clear'));

  document.getElementById('w2-btn-next').addEventListener('click', () => {
    if (step < N) { step++; update(); }
  });
  document.getElementById('w2-btn-prev').addEventListener('click', () => {
    if (step > 0) { step--; update(); }
  });
  document.getElementById('w2-btn-reset').addEventListener('click', () => {
    step = 0; stopAuto(); update();
  });
  document.getElementById('w2-btn-auto').addEventListener('click', () => {
    if (timer) {
      stopAuto();
    } else {
      if (step === N) { step = 0; update(); }
      document.getElementById('w2-btn-auto').textContent = '⏸ 일시 정지';
      timer = setInterval(() => {
        if (step < N) { step++; update(); }
        else { stopAuto(); }
      }, 1800);
    }
  });
})();
</script>
</body>
</html>
